  /* ============================================================
     REBUY — Ubuntu-inspired dark theme
     Palette from the Ubuntu brand: aubergine ground, Ubuntu orange
     for action, Canonical purple for accent, warm neutrals for text.
     ============================================================ */
  :root{
    --u-orange:#E95420; --u-orange-lt:#FF7A4D; --u-purple:#77216F;
    --u-aubergine:#2C001E; --u-warm-grey:#AEA79F; --u-link:#F29879;

    --brand:#E95420; --brand-dark:#C7401A; --brand-50:rgba(233,84,32,.12);
    --accent:#8E5CE6; --accent-2:#00A3A3;

    --bg:#17111A; --bg-2:#1E1622; --card:#221A27; --card-2:#2A2030;
    --ink:#F7F2F5; --ink-2:#E4DCE6; --muted:#A79AAA; --muted-2:#7D6F82;
    --line:#372B3E; --line-2:#453550;

    --ok:#4CC38A; --ok-bg:rgba(76,195,138,.13);
    --warn:#F2B33D; --warn-bg:rgba(242,179,61,.13);
    --bad:#FF6B6B; --bad-bg:rgba(255,107,107,.13);
    --info:#5B9DFF; --info-bg:rgba(91,157,255,.13);

    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.28);
    --glow:0 0 0 1px rgba(233,84,32,.28),0 10px 34px -8px rgba(233,84,32,.42);
    --mono:ui-monospace,SFMono-Regular,"Ubuntu Mono",Menlo,Consolas,monospace;
    --font:'Ubuntu',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);
       font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
       background-image:
         radial-gradient(1200px 600px at 12% -8%, rgba(142,92,230,.16), transparent 62%),
         radial-gradient(900px 520px at 96% 2%, rgba(233,84,32,.13), transparent 58%);
       background-attachment:fixed}
  a{color:var(--u-link);text-decoration:none;transition:color .14s}
  a:hover{color:#FFB79C}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  ::selection{background:rgba(233,84,32,.32)}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#3B2E44;border-radius:8px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#4E3D59}
  :focus-visible{outline:2px solid var(--u-orange);outline-offset:2px}

  /* ---------- shell ---------- */
  #shell{display:flex;min-height:100vh}
  aside{width:246px;flex:0 0 246px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
        background:linear-gradient(180deg,#1C1220 0%,#221629 52%,#2A0F22 100%);
        border-right:1px solid var(--line)}
  .logo{display:flex;align-items:center;gap:11px;padding:20px 18px 16px;color:#fff;font-weight:700;font-size:18px;letter-spacing:-.3px}
  .logo .mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;color:#fff;
    background:linear-gradient(140deg,var(--u-orange),#B9340F);
    box-shadow:0 6px 18px -4px rgba(233,84,32,.7), inset 0 1px 0 rgba(255,255,255,.28)}
  .shopbox{margin:0 12px 12px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid var(--line)}
  .shopbox .nm{color:#fff;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shopbox .sub{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:3px}
  nav{flex:1;padding:4px 9px;overflow:auto}
  nav .sec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);padding:15px 12px 6px;font-weight:500}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:#C9BED0;font-size:13.5px;
           cursor:pointer;margin-bottom:2px;text-decoration:none;transition:background .14s,color .14s;position:relative}
  .navitem:hover{background:rgba(255,255,255,.055);color:#fff}
  .navitem.on{background:linear-gradient(90deg,rgba(233,84,32,.22),rgba(233,84,32,.06));color:#fff;font-weight:500;
              box-shadow:inset 0 0 0 1px rgba(233,84,32,.3)}
  .navitem.on:before{content:"";position:absolute;left:-9px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--u-orange)}
  .navitem .ic{width:18px;display:grid;place-items:center;opacity:.85}
  .navitem.on .ic{opacity:1;color:var(--u-orange-lt)}
  .navitem .pill{margin-left:auto;background:var(--u-orange);color:#fff;font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:500}
  .sidefoot{padding:12px;border-top:1px solid var(--line);font-size:12px}
  .sidefoot a{color:var(--muted);display:flex;gap:8px;align-items:center;padding:7px 5px;border-radius:8px}
  .sidefoot a:hover{color:#fff;background:rgba(255,255,255,.05)}
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header.top{display:flex;align-items:center;gap:12px;padding:14px 26px;position:sticky;top:0;z-index:20;
    background:rgba(23,17,26,.78);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--line)}
  header.top h1{font-size:18px;margin:0;font-weight:500;letter-spacing:-.2px;color:var(--ink)}
  header.top .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  header.top .grow{flex:1}
  .content{padding:24px 26px 72px;max-width:1500px;width:100%}
  @media (max-width:900px){
    aside{display:none}
    header.top{padding:12px 14px}
    .content{padding:14px}
    .mobile-nav{display:flex !important}
  }
  .mobile-nav{display:none;gap:6px;overflow:auto;padding:9px 12px;background:#1C1220;border-bottom:1px solid var(--line)}
  .mobile-nav a{color:#C9BED0;font-size:12px;padding:6px 11px;border-radius:9px;white-space:nowrap;background:rgba(255,255,255,.05)}
  .mobile-nav a.on{background:var(--u-orange);color:#fff}

  /* ---------- primitives ---------- */
  .card{background:linear-gradient(180deg,var(--card),#1F1824);border:1px solid var(--line);
        border-radius:var(--radius);box-shadow:var(--shadow);position:relative;overflow:hidden}
  .card:before{content:"";position:absolute;inset:0 0 auto;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent)}
  .card .hd{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .card .hd h3{margin:0;font-size:13.5px;font-weight:500;letter-spacing:.01em;color:var(--ink)}
  .card .hd .sub{font-size:12px;color:var(--muted)}
  .card .hd .grow{flex:1}
  .card .bd{padding:17px}
  .grid{display:grid;gap:15px}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21{grid-template-columns:2fr 1fr}
  @media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g2{grid-template-columns:1fr}}
  @media (max-width:620px){.g4,.g3{grid-template-columns:1fr}}
  .kpi{padding:16px 17px}
  .kpi .label{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;
    text-transform:uppercase;letter-spacing:.08em;font-weight:500}
  .kpi .value{font-size:27px;font-weight:700;letter-spacing:-.9px;margin-top:7px;
    background:linear-gradient(180deg,#FFFFFF,#D9CBDD);-webkit-background-clip:text;background-clip:text;color:transparent}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);

  .badge.ok{background:var(--ok-bg);color:var(--ok);border-color:rgba(76,195,138,.24)}

       box-shadow:0 0 8px currentColor}

  table.t th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
             font-weight:500;padding:10px 13px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.022);white-space:nowrap}
  table.t td{padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.045);vertical-align:middle;font-size:13px}

  .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
  .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:500;

  /* ---------- chips / tabs ---------- */

  .bubble{max-width:86%;padding:10px 13px;border-radius:14px;font-size:12.8px;position:relative;
    white-space:pre-wrap;word-break:break-word;border:1px solid transparent}
  .bubble.out{background:rgba(142,92,230,.16);border-color:rgba(142,92,230,.24);border-bottom-left-radius:5px;align-self:flex-start}
  .bubble.in{background:rgba(76,195,138,.13);border-color:rgba(76,195,138,.22);border-bottom-right-radius:5px;align-self:flex-end}

  .timeline{position:relative;padding-left:19px}

    background:linear-gradient(180deg,rgba(233,84,32,.45),rgba(255,255,255,.05))}

           font-size:11.5px;word-break:break-all;position:relative;border:1px solid var(--line)}
  details.adv{border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:12px;background:var(--card)}
  details.adv summary{padding:13px 15px;cursor:pointer;font-weight:500;font-size:13px;list-style:none}
  details.adv summary::-webkit-details-marker{display:none}

  .pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:13px 17px;
         border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .selbar{display:none;align-items:center;gap:9px;padding:10px 13px;background:var(--brand-50);
    border:1px solid rgba(233,84,32,.28);border-radius:11px;margin-bottom:11px;font-size:12.5px}
  .selbar.on{display:flex}
  .stat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px}
  .tile{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:rgba(255,255,255,.022)}

  /* ---------- banners, modals, misc ---------- */

  .banner.bad{background:var(--bad-bg);border-color:rgba(255,107,107,.26);color:#FFB3B3}
  .banner.warn{background:var(--warn-bg);border-color:rgba(242,179,61,.26);color:#FFD98A}
  .banner.info{background:var(--info-bg);border-color:rgba(91,157,255,.26);color:#A9C9FF}
  .pagehead{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .pagehead h2{margin:0;font-size:21px;letter-spacing:-.5px;font-weight:700}
  .pagehead .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .pagehead .grow{flex:1}
  .modal{position:fixed;inset:0;display:none;place-items:center;z-index:60;padding:20px}

  .scrim.on{display:block}
  .av{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:500;box-shadow:0 0 0 1.5px rgba(255,255,255,.1)}

  /* ---------- toasts ---------- */
  #toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:360px}

    animation:slidein .24s cubic-bezier(.2,.9,.3,1);color:var(--ink)}
  .toast.ok{border-left-color:var(--ok)}

  @keyframes slidein{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

<body>
<div id="app"></div>
<div id="modals"><div class="scrim" onclick="closeModal()"></div><div id="modalslot"></div></div>
<div id="toasts"></div>
<script>
"use strict";
/* ===================================================================== helpers */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money = (n, cur) => {
  const c = cur || (S.shop && S.shop.currency) || "UGX";
  const v = Number(n || 0);
  const s = Math.abs(v) >= 1000 ? v.toLocaleString("en-US", {maximumFractionDigits: 0}) : v.toLocaleString("en-US", {maximumFractionDigits: 2});
  return v < 0 ? "-" + c + " " + s : c + " " + s;
};
const num = n => Number(n || 0).toLocaleString("en-US");
const pct = n => (n == null ? "—" : Number(n).toFixed(1) + "%");
/* a JS string literal that is safe inside a double-quoted HTML attribute */
const jsq = s => JSON.stringify(String(s == null ? "" : s)).replace(/"/g, "&quot;");
const dt = s => {
  if (!s) return "—";
  const d = new Date(String(s).replace(" ", "T"));
  if (isNaN(d)) return String(s).slice(0, 16);
  const now = new Date();
  const days = Math.floor((now - d) / 86400000);
  if (days === 0 && String(s).length > 10) return d.toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"});
  if (days === 0) return "today";
  if (days === 1) return "yesterday";
  if (days > 0 && days < 7) return days + "d ago";
  return d.toLocaleDateString("en-GB", {day: "2-digit", month: "short", year: d.getFullYear() !== now.getFullYear() ? "numeric" : undefined});
};
const datef = s => s ? new Date(String(s).replace(" ", "T")).toLocaleDateString("en-GB", {day: "2-digit", month: "short", year: "numeric"}) : "—";
const initials = n => (n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
const AV_COLORS = ["#5b3df5","#0d9f6e","#e0782f","#2563eb","#c2418b","#b7791f","#0e7490","#7c3aed"];
const avColor = s => AV_COLORS[Math.abs(String(s || "").split("").reduce((a, c) => a + c.charCodeAt(0), 0)) % AV_COLORS.length];
const avatar = (n, size) => `<div class="avatar" style="background:${avColor(n)};${size ? `width:${size}px;height:${size}px;flex:0 0 ${size}px;font-size:${size * .38}px` : ""}">${esc(initials(n))}</div>`;
const RISK = {new: ["new", ""], healthy: ["healthy", "ok"], due: ["due soon", "info"], overdue: ["overdue", "warn"],
              at_risk: ["at risk", "bad"], lost: ["lost", "bad"]};
const riskBadge = b => { const [l, c] = RISK[b] || [b || "—", ""]; return `<span class="badge ${c}"><span class="dot"></span>${l}</span>`; };
const CHAN_ICON = {whatsapp: icon("message", 13), sms: icon("phone", 13), email: icon("inbox", 13)};
const STATUS_BADGE = {scheduled: "", sent: "info", delivered: "ok", replied: "brand", converted: "ok", failed: "bad",
                      cancelled: "", skipped: "", superseded: "", queued: "warn", pending: "", opened: "info", bounced: "bad"};

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "bad" ? 5200 : 3200);
}

async function api(path, opts) {
  opts = opts || {};
  const init = {method: opts.method || "GET", headers: {"accept": "application/json"}, credentials: "same-origin"};
  if (opts.body !== undefined) { init.headers["content-type"] = "application/json"; init.body = JSON.stringify(opts.body); }
  const r = await fetch(path, init);
  let data = null;
  const text = await r.text();
  try { data = text ? JSON.parse(text) : {}; } catch (e) { data = {error: text.slice(0, 300)}; }
  if (!r.ok) {
    const err = new Error((data && (data.message || data.error)) || ("HTTP " + r.status));
    err.status = r.status; err.data = data;
    throw err;
  }
  return data;
}

function openModal(title, bodyHtml, footerHtml, wide) {
  $("#modalslot").innerHTML = `<div class="modal ${wide ? "wide" : ""}"><header><h3>${esc(title)}</h3>
    <button class="x" onclick="closeModal()">✕</button></header>
    <div class="body">${bodyHtml}</div>${footerHtml ? `<footer>${footerHtml}</footer>` : ""}</div>`;
  $("#modals").classList.add("open");
}
function closeModal() { $("#modals").classList.remove("open"); $("#modalslot").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ===================================================================== state */
const S = {
  user: null, shop: null, route: "", days: 30, cache: {}, query: "",
  tpl: [], sectors: [], cycles: {}, notice: null,
};
const PLAN_NAMES = {starter: "Starter", growth: "Growth", scale: "Scale"};


/* Inline stroke icons. Glyph characters were used before, but coverage across
   Ubuntu/system fonts is patchy — half the nav rendered as blank boxes on some
   devices. These are 24x24 paths that inherit currentColor, so they always draw. */
function icon(name, size) {
  const s = size || 17;
  const P = {
    dashboard: "M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z",
    inbox: "M3 7l9 6 9-6M3 7v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7M3 7a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1",
    reminders: "M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z",
    clients: "M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm11.5 9v-1a4 4 0 0 0-3-3.87M16 3.13A4 4 0 0 1 16 11",

/* ===================================================================== router */
// Pages that work without a shop (everything else 403s with "shop account required").
const NO_SHOP_PAGES = new Set(["onboarding", "account", "admin"]);

const ROUTES = {};
/* page(path, opts, render[, extra])
   `extra` exists because a page can be declared with its mount hook as a 4th
   argument. The old 3-argument signature silently dropped it, which is why the
   dashboard chart never drew: the route had no mount to call. */
function page(path, opts, render, extra) {
  ROUTES[path] = Object.assign({render}, opts || {}, extra || {});
}

async function boot() {
  // top-level error surface
  window.addEventListener("unhandledrejection", ev => {
    const e = ev.reason || {};
    // An account with no shop cannot use shop-scoped endpoints; that is a
    // normal state on the way to onboarding, not an error worth a toast.
    if (e && e.status === 403 && /shop account required/i.test(e.message || "")) {
      ev.preventDefault(); return;
    }
    if (e && e.status) { toast(e.message || "Request failed", "bad"); ev.preventDefault(); }
  });
  const hash = (location.hash || "#/dashboard").slice(1) || "/dashboard";
  // "?error=..." on the hash is data for the page, not part of the route.
  const path = hash.split("?")[0] || "/dashboard";
  S.query = hash.split("?")[1] || "";
  S.route = path;
  const isOpenRoute = ["/login", "/signup", "/onboarding", "/admin", "/forgot", "/reset"].includes("/" + path.split("/")[1]);
  try {
    const me = await api("/api/auth/me");
    S.meta = {google_enabled: !!me.google_enabled, signup_open: me.signup_open !== false};
    if (me.authenticated) {
      S.user = me.user; S.shop = me.shop;
      if (S.user.role === "admin" && path.split("/")[1] !== "admin") { location.hash = "#/admin"; return; }
    }
  } catch (e) { /* offline: fall through */ }
  // Arriving at a protected route while signed out: send them to the login screen,
  // carrying over any ?error= so the reason survives the bounce.
  if (!S.user && !isOpenRoute) {
    location.hash = "#/login" + (S.query ? "?" + S.query : "");
    return;
  }
  if (S.user && ["/login", "/signup"].includes(path.split("?")[0])) {
    location.hash = S.user.role === "admin" ? "#/admin" : (S.user.shop_id ? "#/dashboard" : "#/onboarding");
    return;
  }
  // An account with no shop cannot use shop-scoped pages at all: every one of
  // them 403s. Send them to the page that explains it and offers a way forward.
  if (S.user && !S.user.shop_id && !NO_SHOP_PAGES.has(path.split("/")[1] || "dashboard")) {
    location.hash = "#/onboarding"; return;
  }
  if (S.user && S.user.shop_id) refreshNotice();
  render(path);
}

function render(path) {
  S.route = path;
  const parts = (path.split("?")[0] || "").split("/").filter(Boolean);
  // The platform cockpit is its own document, not an SPA route. Without this
  // #/admin fell through to the dashboard, which 403s for a shopless admin.
  if (parts[0] === "admin") { window.location.replace("/admin"); return; }           // e.g. ["nudges","settings"]
  // exact route first ("/nudges/settings"), then the section ("/nudges"),
  // then the fallback. Sub-pages use the exact match.
  const exact = "/" + parts.join("/");
  const key = "/" + (parts[0] || "dashboard");
  const spec = ROUTES[exact] || ROUTES[key] || ROUTES["/dashboard"];
  const ctx = {parts, rest: parts.slice(1), path};
  const app = $("#app");
  try {
    const out = spec.render(ctx);
    if (out && typeof out.then === "function") {
      app.innerHTML = `<div style="padding:60px;text-align:center;color:var(--muted)">Loading…</div>`;
      out.then(html => { app.innerHTML = html; if (spec.mount) spec.mount(ctx); })
         .catch(err => { app.innerHTML = shell(`<div class="card"><div class="bd"><b>Could not load this page.</b><div class="muted mt8">${esc(err.message || err)}</div></div></div>`); });
    } else {
      app.innerHTML = out;
      if (spec.mount) spec.mount(ctx);
    }
  } catch (err) {
    app.innerHTML = `<div class="card"><div class="bd"><b>Page error</b><div class="muted mt8">${esc(err.message || err)}</div></div></div>`;
  }
  const meta = PAGES["/" + (parts[0] || "dashboard")];
  if (meta) setPage(meta[0], meta[1]);
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", () => {
  const hash = (location.hash || "#/dashboard").slice(1) || "/dashboard";
  S.query = hash.split("?")[1] || "";
  const path = hash.split("?")[0] || "/dashboard";
  if (!S.user && !["/login", "/signup", "/onboarding", "/admin"].includes("/" + path.split("/")[1])) {
    location.hash = "#/login"; return;
  }
  render(path);
});

async function refreshNotice() {
  try {
    const [shop, dash] = await Promise.all([api("/api/shop"), api("/api/inbox?unread=1")]);
    S.shop = shop.shop;
    S.notice = {unread: dash.unread_unread || (dash.unread && dash.unread.length) || 0,
                due_reminders: shop.counts ? shop.counts.reminders_due : 0};
    $$(".navitem").forEach(a => {
      const k = (NAV.find(n => a.getAttribute("href") === "#" + n.r) || {}).badgeKey;
      if (k) {
        const v = S.notice[k] || 0;
        let pill = $(".pill", a);
        if (v) { if (!pill) { pill = document.createElement("span"); pill.className = "pill"; a.appendChild(pill); } pill.textContent = v; }
        else if (pill) pill.remove();
      }
    });
  } catch (e) { /* ignore */ }
}

async function runTick(verbose) {
  try {
    const r = await api("/api/reminders/run", {method: "POST"});
    const s2 = r.stats || {};
    toast(`Queue processed — ${s2.dispatched || 0} messages sent${s2.errors ? ` · ${s2.errors} errors` : ""}`, "ok");
    if (verbose) setTimeout(() => location.reload(), 700);
    else refreshNotice();
  } catch (e) { toast(e.message, "bad"); }
}

async function logout() {
  try { await api("/api/auth/logout", {method: "POST"}); } catch (e) {}
  S.user = null; S.shop = null;

}

async function doSignup(ev) {
  ev.preventDefault();
  const f = ev.target;
  const btn = $("button[type=submit]", f);
  btn.disabled = true; btn.textContent = "Creating…";
  try {
    const body = {};
    for (const el of f.elements) if (el.name) body[el.name] = el.value;
    const r = await api("/api/signup", {method: "POST", body});
    S.user = r.user; S.shop = r.shop;
    toast("Shop created — let's get you set up", "ok");
    location.hash = "#/onboarding";
  } catch (e) { toast(e.message || "Could not create the shop", "bad"); btn.disabled = false; btn.textContent = "Create my shop →"; }
}

let CHART_DATA = null;

/* Revenue & outreach chart.
   The API emits {day, value, n}; an earlier version read `.v` and silently
   drew NaN rectangles, so the panel looked empty rather than broken. */
function drawRevenueChart() {
  const el = $("#chart1");
  if (!el || !CHART_DATA) return;
  const sales = (CHART_DATA.sales || []).map(p => ({d: p.day, value: +p.value || 0}));
  const msgs = (CHART_DATA.msgs || []).map(p => ({d: p.day, value: +p.value || 0}));
  if (!sales.length) {
    el.innerHTML = `<div class="empty" style="padding:56px 12px"><div class="big">${icon("reports", 30)}</div>
      No sales in this window yet.</div>`;
    return;
  }
  const w = Math.max(360, el.clientWidth || 600), h = 200, padL = 8, padR = 8, base = h - 26;
  const maxS = Math.max(1, ...sales.map(p => p.value));
  const maxM = Math.max(1, ...msgs.map(p => p.value));
  const n = sales.length;
  const step = (w - padL - padR) / n;
  const bw = Math.max(3, Math.min(26, step - 3));
  const cx = i => padL + i * step + step / 2;
  const yS = (v, max) => base - (base - 18) * (v / max);

  // area under the message line, so both series read at a glance
  const line = msgs.map((p, i) => `${i ? "L" : "M"}${cx(i).toFixed(1)},${yS(p.value, maxM).toFixed(1)}`).join(" ");
  const area = msgs.length
    ? `${line} L${cx(msgs.length - 1).toFixed(1)},${base} L${cx(0).toFixed(1)},${base} Z` : "";

  const gridlines = [0, .25, .5, .75, 1].map(f => {
    const y = base - (base - 18) * f;
    return `<line x1="0" x2="${w}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"
             stroke="rgba(255,255,255,.055)" stroke-width="1"/>`;
  }).join("");

  el.innerHTML = `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"
      style="display:block;overflow:visible" role="img" aria-label="Sales and messages over time">
    <defs>
      <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FF8A5C"/><stop offset="1" stop-color="#E95420"/>
      </linearGradient>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8E5CE6" stop-opacity=".42"/>
        <stop offset="1" stop-color="#8E5CE6" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridlines}
    ${sales.map((p, i) => {
      const y = yS(p.value, maxS), hgt = Math.max(2, base - y);
      return `<rect x="${(cx(i) - bw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}"
        height="${hgt.toFixed(1)}" rx="4" fill="url(#barGrad)" opacity=".95">
        <title>${p.d}: ${money(p.value)}</title></rect>`;
    }).join("")}
    ${area ? `<path d="${area}" fill="url(#areaGrad)"/>` : ""}
    ${msgs.length ? `<path d="${line}" fill="none" stroke="#A87DFF" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round">
        ${msgs.map((p, i) => `<title>${p.d}: ${p.value} messages</title>`).join("")}</path>` : ""}
    <line x1="0" x2="${w}" y1="${base}" y2="${base}" stroke="rgba(255,255,255,.14)"/>
    <text x="2" y="${h - 6}" font-size="10.5" fill="#A79AAA" font-family="Ubuntu,sans-serif">${sales[0].d}</text>
    <text x="${w - 2}" y="${h - 6}" font-size="10.5" fill="#A79AAA" text-anchor="end"
      font-family="Ubuntu,sans-serif">${sales[sales.length - 1].d}</text>
  </svg>
  <div class="row mt12" style="gap:18px">
    <span class="tiny muted"><span class="dot" style="color:#E95420"></span> Sales &middot; peak ${money(maxS)}</span>
    <span class="tiny muted"><span class="dot" style="color:#A87DFF"></span> Messages sent &middot; peak ${num(maxM)}</span>
  </div>`;
}

function donut(parts) {
  const total = parts.reduce((a, p) => a + p.n, 0) || 1;
  let acc = 0;
  const segs = parts.map(p => {
    const frac = p.n / total, start = acc; acc += frac;
    return {p, start};
  });
  const r = 42, c = 50, circ = 2 * Math.PI * r;
  return `<svg width="116" height="116" viewBox="0 0 100 100"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/>
  ${segs.map(s => `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.p.color}" stroke-width="14"
     stroke-dasharray="${(s.p.n / total * circ).toFixed(2)} ${circ.toFixed(2)}" stroke-dashoffset="${(-s.start * circ).toFixed(2)}"
     transform="rotate(-90 ${c} ${c})"><title>${esc(s.p.label)}: ${s.p.n}</title></circle>`).join("")}
  <text x="${c}" y="${c + 2}" text-anchor="middle" font-size="16" font-weight="700" fill="#F7F2F5" font-family="Ubuntu,sans-serif">${num(total)}</text>
  <text x="${c}" y="${c + 14}" text-anchor="middle" font-size="6.6" letter-spacing=".7" fill="#A79AAA" font-family="Ubuntu,sans-serif">CUSTOMERS</text></svg>`;
}

function careFileToData(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("could not read that file"));
    r.readAsDataURL(file);
  });
}

async function careUpload(input, preview) {
  const f = input.files && input.files[0];
  if (!f) return;
  const slot = $("#careImportResult");
  slot.innerHTML = `<div class="muted tiny mt8">Reading ${esc(f.name)}…</div>`;
  try {
    const data = await careFileToData(f);
    const r = await api("/api/care/import/preview", {method: "POST", body: {filename: f.name, data}});
    const map = Object.entries(r.mapping).map(([k, v]) => `<span class="badge">${esc(k)} ← ${esc(v)}</span>`).join(" ");
    slot.innerHTML = `<div class="card mt12"><div class="hd"><h3>Check before importing</h3>
        <div class="grow"></div><span class="badge">${r.rows_found} rows</span></div><div class="bd">
      <div class="tiny muted">We matched these columns:</div>
      <div class="mt8" style="display:flex;gap:6px;flex-wrap:wrap">${map || "<i>no columns matched</i>"}</div>
      ${r.unmapped_columns && r.unmapped_columns.length ? `<div class="tiny muted mt8">Ignored columns: ${r.unmapped_columns.map(esc).join(", ")}</div>` : ""}
      ${r.would_reject ? `<div class="banner bad mt12">${r.would_reject} of the first ${Math.min(r.rows_found,500)} rows would be skipped.</div>
        <div class="tiny muted mt8">${r.reject_examples.map(e => `row ${e.row}: ${esc(e.why)}`).join("<br>")}</div>` : ""}
      <div class="tiny muted mt12">These fields are encrypted the moment they land: ${r.will_encrypt.map(esc).join(", ")}.</div>
      <button class="btn primary mt12" style="width:100%;justify-content:center" onclick="careCommit('${esc(f.name)}')">Import ${r.rows_found} client records</button>
    </div></div>`;
    window._carePending = data;
  } catch (e) {
    slot.innerHTML = `<div class="banner bad mt12">${esc(e.message)}</div>`;
  }
}

async function careCommit(filename) {
  const data = window._carePending;
  if (!data) return;
  const slot = $("#careImportResult");
  slot.innerHTML = `<div class="muted tiny mt8">Importing… this can take a moment for large files.</div>`;
  try {
    const r = await api("/api/care/import", {method: "POST",
      body: {filename, data, update_existing: true, schedule_recalls: true}});
    slot.innerHTML = `<div class="card mt12"><div class="bd">
      <b>${r.created} clients added</b>, ${r.updated} updated, ${r.skipped} skipped.
      ${r.recalls_scheduled ? `<div class="tiny muted mt8">${r.recalls_scheduled} recall${r.recalls_scheduled === 1 ? "" : "s"} scheduled from the dates in your file.</div>` : ""}
      ${r.skipped ? `<div class="tiny muted mt8">${r.report.slice(0,8).map(e => `row ${e.row}: ${esc(e.why || e.status)}`).join("<br>")}</div>` : ""}

    </div></div>`;
    window._carePending = null;
  } catch (e) {
    slot.innerHTML = `<div class="banner bad mt12">${esc(e.message)}</div>`;
  }
}

/* "Reason" reads as a sentence, not as a database enum twice over. A loyalty
   or win-back reminder has no product_name, so the old markup printed
   "loyalty_reward loyalty_reward" — the name and the badge were the same field. */
const KIND_LABEL = {
  replenishment: "Product running out", rebooking: "Service re-booking",
  loyalty_reward: "Loyalty reward", winback: "Win-back", coupon: "Coupon offer",
  followup: "Follow-up", birthday: "Birthday", recall: "Service recall",
};
function reasonCell(r) {
  const label = KIND_LABEL[r.kind] || String(r.kind || "").replace(/_/g, " ");
  const product = (r.product_name || "").trim();
  const same = product.toLowerCase() === String(r.kind || "").toLowerCase();
  return product && !same
    ? `${esc(product)}<div class="tiny muted">${esc(label)}</div>`
    : `<span>${esc(label)}</span>`;
}
async function loadReminders(tab) {
  $$("[id^=rtab-]").forEach(c => c.classList.toggle("on", c.id === "rtab-" + tab));
  const box = $("#remTable");
  if (!box) return;
  box.innerHTML = `<div class="empty">Loading…</div>`;
  const d = await api("/api/reminders?" + (tab === "due" ? "due=today" : tab === "all" ? "" : "status=" + tab) + "&limit=120");
  const rows = d.rows || [];
  box.innerHTML = `<table class="t"><thead><tr><th>Due</th><th>Customer</th><th>Reason</th><th>Channel</th><th>Status</th><th class="right">Actions</th></tr></thead><tbody>
    ${rows.map(r => `<tr>
      <td class="nowrap">${r.due_on <= todayStr() ? `<span class="badge warn">${dt(r.due_on)}</span>` : dt(r.due_on)}</td>
      <td><a href="#/customers/${r.customer_id}"><b>${esc(r.customer)}</b></a><div class="tiny muted">${esc(r.phone || "")}</div></td>
      <td>${reasonCell(r)}</td>
      <td><span class="badge">${CHAN_ICON[r.channel] || ""} ${esc(r.channel)}</span></td>
      <td><span class="badge ${STATUS_BADGE[r.status] || ""}">${esc(r.status)}</span></td>
      <td class="right nowrap">
        ${["scheduled", "failed"].includes(r.status) ? `<button class="btn sm primary" onclick="sendReminder(${r.id})">Send now</button>
          <button class="btn sm" onclick="snoozeReminder(${r.id})">Snooze</button>
          <button class="btn sm danger" onclick="skipReminder(${r.id})">Skip</button>` : `<a class="btn sm" href="#/customers/${r.customer_id}">View</a>`}
      </td></tr>`).join("") || `<tr><td colspan="6"><div class="empty"><div class="big">⏰</div>Nothing in this queue</div></td></tr>`}
  </tbody></table>`;
}
const todayStr = () => new Date().toISOString().slice(0, 10);
const daysFromNow = n => new Date(Date.now() + n * 86400000).toISOString().slice(0, 10);
async function toggleAuto(v) {
  try { await api("/api/shop", {method: "PATCH", body: {auto_reminders: v}}); S.shop.auto_reminders = v; toast(v ? "Auto-reminders on" : "Auto-reminders paused", "ok"); location.reload(); }

async function sendReminder(id) {
  try { const r = await api(`/api/reminders/${id}/send`, {method: "POST"}); toast("Reminder queued and sent", "ok"); loadReminders("due"); }

async function skipReminder(id) {

}
function addLine(pre) {
  if (pre && pre.name) {
    const existing = SALE.lines.find(l => l.name === pre.name && !l.price);
    if (existing) { existing.price = pre.price; existing.cycle = pre.cycle; renderLines(); return; }
    SALE.lines.push({name: pre.name, price: pre.price, qty: 1, unit: pre.unit || "pc", cycle: pre.cycle || "", kind: pre.kind || "goods"});
  } else {
    SALE.lines.push({name: "", price: "", qty: 1, unit: "pc", cycle: "", kind: "goods"});
  }
  renderLines();
}
function removeLine(i) { SALE.lines.splice(i, 1); renderLines(); }
function renderLines() {
  const box = $("#saleLines");
  if (!box) return;
  if (!SALE.lines.length) SALE.lines.push({name: "", price: "", qty: 1, unit: "pc", cycle: "", kind: "goods"});
  box.innerHTML = SALE.lines.map((l, i) => `<div class="row mb8" style="gap:7px;align-items:flex-start">
    <input class="input" style="flex:2.2" placeholder="Item or service name" value="${esc(l.name)}" oninput="SALE.lines[${i}].name=this.value">
    <input class="input" style="flex:.7" type="number" step="0.01" placeholder="Qty" value="${esc(l.qty)}" oninput="SALE.lines[${i}].qty=this.value;calcTotal()">
    <input class="input" style="flex:1" type="number" step="0.01" placeholder="Unit price" value="${esc(l.price)}" oninput="SALE.lines[${i}].price=this.value;calcTotal()">
    <input class="input" style="flex:.8" type="number" placeholder="Cycle days" title="How long this lasts before the customer needs it again" value="${esc(l.cycle)}" oninput="SALE.lines[${i}].cycle=this.value">
    <button class="btn sm danger" onclick="removeLine(${i})">✕</button></div>`).join("");
  calcTotal();
}
function calcTotal() {
  const t = SALE.lines.reduce((a, l) => a + (Number(l.qty || 0) * Number(l.price || 0)), 0);
  const el = $("#saleTotal"); if (el) el.innerHTML = `Total: <b>${money(t)}</b>`;
}
function pickCust(v) {
  const opt = $$("#custList option").find(o => o.value === v);
  SALE.cid = opt ? Number(opt.dataset.id) : null;
  const el = $("#custPick");
  if (el) el.textContent = SALE.cid ? "✓ Existing customer selected" : "Or type a new name below to create them.";
}
async function submitSale() {
  const lines = SALE.lines.filter(l => (l.name || "").trim());
  if (!lines.length) { toast("Add at least one item", "bad"); return; }
  const body = {
    customer_id: SALE.cid || undefined,
    customer_name: $("#newCustName") ? $("#newCustName").value : "",
    customer_phone: $("#newCustPhone") ? $("#newCustPhone").value : "",
    customer_email: $("#newCustEmail") ? $("#newCustEmail").value : "",
    date: $("#saleDate").value, receipt_no: $("#saleReceipt").value,
    payment_method: $("#salePay").value, staff_name: $("#saleStaff").value,
    items: lines.map(l => ({product_name: l.name, qty: Number(l.qty || 1), unit_price: Number(l.price || 0),
                            cycle_days: l.cycle ? Number(l.cycle) : undefined, kind: l.kind, unit: l.unit})),
  };
  if (!SALE.cid) {
    // let the API create the customer from the typed details (or a walk-in name)
    body.customer_name = body.customer_name || ($("#saleCustSearch") ? $("#saleCustSearch").value.split(" · ")[0] : "") || "Walk-in customer";
  }
  try {
    const r = await api("/api/sales", {method: "POST", body});
    toast(`Sale recorded · ${r.reminders_planned} reminder(s) scheduled`, "ok");
    SALE = {cid: null, lines: []};
    location.hash = "#/sales/" + r.sale_id;

}

async function previewSegment() {
  const seg = (window.__segments || []).find(s => s.key === $("#campSeg").value) || {};
  try {
    const r = await api("/api/campaigns/preview", {method: "POST", body: {segment: seg.segment || {}}});
    $("#campAudience").textContent = num(r.count || 0) + " recipients";
  } catch (e) { $("#campAudience").textContent = "—"; }

async function previewCampaign() {

async function sendCampaign() {
  const seg = (window.__segments || []).find(s => s.key === $("#campSeg").value) || {};
  const msg = $("#campMsg").value;
  const firstLine = (msg.split("\n")[0] || "A quick update").slice(0, 70);
  const body = {name: $("#campName").value || "Campaign " + new Date().toLocaleDateString("en-GB"),
                segment: seg.segment || {}, template_key: "broadcast", channel: "whatsapp", status: "draft"};
  try {
    const c = await api("/api/campaigns", {method: "POST", body});
    const cid = c.campaign.id;
    const r = await api(`/api/campaigns/${cid}/send`, {method: "POST", body: {
      headline: firstLine, body: msg,
      coupon_percent: $("#campCoupon").checked ? Number($("#campPct").value || 0) : 0}});
    closeModal();
    toast(`Campaign queued for ${num(r.queued || 0)} of ${num(r.recipients || 0)} customers`, "ok");
    render("/segments");
  } catch (e) { toast(e.message, "bad"); }
}

function pickFile(inp) {
  const f = inp.files[0];
  if (!f) return;
  uploadFile(f);
}
function dropFile(ev) {
  ev.preventDefault();
  $("#drop").style.borderColor = "#d5d0ea";
  const f = ev.dataTransfer.files[0];
  if (f) uploadFile(f);
}
function readAsDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}
async function uploadFile(file) {
  const box = $("#importPreview");
  box.innerHTML = `<div class="empty">Reading ${esc(file.name)}…</div>`;
  try {
    const data = await readAsDataURL(file);
    const prev = await api("/api/import/preview", {method: "POST", body: {filename: file.name, data}});
    box.innerHTML = `<div class="card"><div class="hd"><h3>Found ${num(prev.rows_found)} rows in ${esc(file.name)}</h3></div><div class="bd">
      <div class="row wrap tiny mb12" style="gap:8px">${Object.entries(prev.mapping || {}).map(([k, v]) => `<span class="badge info">${esc((prev.headers || [])[v] || v)} → ${esc(k)}</span>`).join("")}</div>
      <div class="scrollx"><table class="t"><thead><tr><th>Receipt</th><th>Date</th><th>Customer</th><th>Phone</th><th>Item</th><th>Qty</th><th>Amount</th></tr></thead><tbody>
        ${(prev.sample || []).map(r => `<tr><td class="mono">${esc(r.receipt_no || "—")}</td><td>${esc(r.date || "")}</td><td>${esc(r.name || "")}</td>
          <td class="tiny">${esc(r.phone || "")}</td><td>${esc(r.product || "")}</td><td>${esc(r.qty || "")}</td><td>${esc(r.line_total || "")}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="row mt12"><span class="badge">${num(prev.groups)} receipts detected</span><div class="grow"></div>
        <button class="btn primary" onclick="commitImport('${esc(file.name)}', this)">Import ${num(prev.rows_found)} rows →</button></div>
    </div></div>`;
    window.__pendingFile = {data, name: file.name};
  } catch (e) { box.innerHTML = `<div class="card"><div class="bd"><b>Could not read that file.</b><div class="tiny muted mt8">${esc(e.message)}</div></div></div>`; }
}
async function commitImport(name, btn) {
  const f = window.__pendingFile;
  if (!f) return;
  btn.disabled = true; btn.textContent = "Importing…";
  try {
    const r = await api("/api/import/file", {method: "POST", body: {filename: f.name, data: f.data}});
    toast(`Imported ${num((r.report && r.report.sales) || 0)} sales · ${num((r.report && r.report.customers) || 0)} customers · ${num((r.report && r.report.reminders) || 0)} reminders`, "ok");
    render("/import");
  } catch (e) { toast(e.message, "bad"); btn.disabled = false; btn.textContent = "Try again"; }
}
function sampleCsv() {
  const today = new Date();
  const d = n => new Date(today - n * 86400000).toISOString().slice(0, 10);
  const who = [["Aisha Nabirye", "+256772445118", "Ntinda"], ["Brian Okello", "+256701882003", "Kireka"],
               ["Grace Atim", "+256782119944", "Bugolobi"], ["Moses Kaggwa", "+256703447812", "Nakawa"],
               ["Sandra Nansubuga", "+256775990210", "Muyenga"], ["Peter Wanyama", "+256787220145", "Kawempe"]];
  const items = [["Rice 2kg", "Grains & Flour", 12000, 1], ["Cooking oil 1L", "Cooking Oil", 8500, 1],
                 ["Sugar 1kg", "Sugar", 4500, 2], ["Maize flour 2kg", "Grains & Flour", 6000, 1],
                 ["Milk 500ml", "Dairy & Eggs", 2500, 4], ["Soap bar", "Personal Care", 3500, 1]];
  const rows = [["receipt_no", "date", "customer", "phone", "area", "item", "category", "qty", "price", "total", "payment"]];
  let n = 4000;
  for (let v = 0; v < 6; v++) {
    for (let k = 0; k < 2 + (v % 3); k++) {
      const [name, phone, area] = who[v];
      const [item, cat, price] = items[(v + k) % items.length];
      const qty = 1 + ((v + k) % 3);
      n++;
      rows.push(["R" + n, d(k * 12 + v * 2), name, phone, area, item, cat, qty, price, price * qty, k % 2 ? "cash" : "mobile money"]);
    }
  }
  return rows.map(r => r.join(",")).join("\n");
}

function funnelRow(label, n, total) {

  return `<div style="margin-bottom:10px">

/* --- the map: pure SVG, no tiles, works offline and in the static demo --- */
function drawGeofence() {
  const el = $("#geofenceMap");
  if (!el) return;
  const places = (S.nudgePlaces || []).length ? S.nudgePlaces : (S.lastInsights ? S.lastInsights.places : []);
  const people = (S.nearbyPeople || []);
  if (!places || !places.length) { el.innerHTML = `<div class="empty">No location to draw</div>`; return; }
  const W = 640, H = 300;
  const cx = places[0].lat, cy = places[0].lng;
  const SPAN = 0.012;                       // ~1.3 km across
  const px = p => W / 2 + ((p.lng - cy) / SPAN) * (W / 2);
  const py = p => H / 2 - ((p.lat - cx) / SPAN) * (H / 2);
  const ring = r => Math.max(6, (r / SPAN) * (W / 2) / 111320 * 111320 / 1);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:linear-gradient(160deg,#f7f6fb,#eceaf6);border-radius:10px">`;
  svg += `<defs><radialGradient id="gfade"><stop offset="0%" stop-color="#5b4bd6" stop-opacity=".16"/><stop offset="100%" stop-color="#5b4bd6" stop-opacity="0"/></radialGradient></defs>`;
  svg += `<circle cx="${W/2}" cy="${H/2}" r="${300}" fill="url(#gfade)"/>`;
  places.forEach(p => {
    const r = (p.radius_m / 111320) / SPAN * (W / 2);
    svg += `<circle cx="${px(p)}" cy="${py(p)}" r="${r}" fill="rgba(91,75,214,.13)" stroke="rgba(91,75,214,.45)" stroke-width="1.2" stroke-dasharray="4 3"/>`;
  });
  people.forEach((p, i) => {
    const d = p.distance_m || 0;
    const ang = (i * 137.5) * Math.PI / 180;
    const rr = Math.min(1, d / 1200) * (W / 2 - 22);
    const x = W / 2 + Math.cos(ang) * rr, y = H / 2 + Math.sin(ang) * rr;
    const col = d < 250 ? "#0d9f6e" : d < 700 ? "#b7791f" : "#8b8b9e";
    svg += `<circle cx="${x}" cy="${y}" r="4.5" fill="${col}" opacity=".9"><title>${esc(p.name || "")} — ${Math.round(d)} m</title></circle>`;
  });
  places.forEach(p => {
    svg += `<rect x="${px(p)-7}" y="${py(p)-7}" width="14" height="14" rx="3" fill="#5b4bd6"/>`;
    svg += `<text x="${px(p)}" y="${py(p)+24}" font-size="10" text-anchor="middle" fill="#4b4b5e">${esc(p.label)}</text>`;
  });
  svg += `<text x="10" y="${H-10}" font-size="9.5" fill="#8b8b9e">each dot is a shopper's last reported fix · circle = geofence</text>`;
  svg += `</svg>`;
  el.innerHTML = svg;
}

function drawBestTimes() {
  const el = $("#bestTimeChart");
  if (!el) return;
  const hours = (S.bestTimes || []);
  if (!hours.length) { el.innerHTML = `<div class="empty">Not enough sales history yet</div>`; return; }
  const peak = Math.max(1, ...hours.map(h => h.count));
  el.innerHTML = `<div class="row" style="align-items:flex-end;gap:2px;height:70px">` +
    hours.map(h => `<div title="${h.hour}:00 — ${h.count} sales" style="flex:1;height:${Math.max(3, 100 * h.count / peak)}%;background:${h.share > .55 ? "#5b4bd6" : "#c9c3ea"};border-radius:2px"></div>`).join("") +
    `</div><div class="row tiny muted" style="justify-content:space-between;margin-top:6px"><span>00h</span><span>06h</span><span>12h</span><span>18h</span><span>23h</span></div>`;
}

          <div class="field"><label class="f">Role</label><select class="input" name="role"><option value="staff">Staff — sales, customers, reminders</option><option value="owner">Owner — full access</option></select></div>
          <button class="btn primary" style="width:100%;justify-content:center">Send invitation</button>
          <div class="tiny muted mt8">They sign in with that Google account — no password to share.</div>

      ${invites.length ? `<div class="card mt16"><div class="hd"><h3>Pending</h3><span class="muted tiny">${invites.length}</span></div><div class="bd">

});

async function inviteMember(ev) {
  ev.preventDefault();
  const f = ev.target, btn = $("button[type=submit]", f) || $("button", f);
  btn.disabled = true;
  try {
    const r = await api("/api/team/invite", {method: "POST", body: {email: f.email.value.trim(), role: f.role.value}});
    toast(r.invite.email_sent ? "Invitation emailed" : "Invitation created — share the link", "ok");
    if (!r.invite.email_sent && r.invite.link) {
      try { await navigator.clipboard.writeText(r.invite.link); toast("Invite link copied", "ok"); } catch (e) {}
    }
    render(S.route);
  } catch (e) { toast(e.message, "bad"); btn.disabled = false; }
}
async function setRole(uid, role) {
  try { await api("/api/team/role", {method: "POST", body: {user_id: uid, role}}); toast("Role updated", "ok"); render(S.route); }

}
async function removeMember(uid, name) {

}
async function cancelInvite(id) {

/* Two-step, typed confirmation. A shop owner is about to destroy the business
   record, so a plain confirm() is not enough — and the store requirement is
   that this exists in the app, not only on the website. */
async function deleteAccount() {
  const typed = prompt("This permanently deletes your account" +
    (S.user && S.user.role === "owner" ? " and your entire shop's data" : "") +
    ".\n\nType DELETE to confirm:");
  if (typed === null) return;
  if (typed.trim().toUpperCase() !== "DELETE") { toast("Nothing was deleted", "bad"); return; }
  const pw = S.user && S.user.has_password ? prompt("Enter your password to confirm:") : "";
  if (S.user && S.user.has_password && pw === null) return;
  try {
    await api("/api/auth/delete-account", {method: "POST", body: {confirm: "delete", password: pw || ""}});
    S.user = null; S.shop = null;
    toast("Your account has been deleted", "ok");
    location.hash = "#/login"; location.reload();
  } catch (e) { toast(e.message || "Could not delete the account", "bad"); }
}

async function linkGoogle() {
  try { const r = await api("/api/auth/google/start?next=/account"); location.href = r.url; }
  catch (e) { toast(e.message || "Google is not available", "bad"); }
}
async function changePassword(ev) {
  ev.preventDefault();
  const f = ev.target;
  if (f.new_password.value !== f.confirm.value) { toast("Passwords do not match", "bad"); return; }
  try {
    await api("/api/auth/password", {method: "POST", body: {
      current_password: f.current_password ? f.current_password.value : "",
      new_password: f.new_password.value}});
    toast("Password updated — other devices signed out", "ok");
    f.reset(); render(S.route);
  } catch (e) { toast(e.message, "bad"); }
}
async function revokeSession(id) {
  try { await api("/api/auth/sessions/revoke", {method: "POST", body: {id}}); toast("Session revoked", "ok"); render(S.route); }
  catch (e) { toast(e.message, "bad"); }
}
async function logoutEverywhere() {
  if (!confirm("Sign out of every device, including this one?")) return;

async function saveChannels() {
  const wa = {phone_number_id: $("#waPhoneId").value.trim(), token: $("#waToken").value.trim(), api_version: $("#waVer").value.trim() || "v21.0"};
  const sms = {sid: $("#smsSid").value.trim(), token: $("#smsToken").value.trim(), from_number: $("#smsFrom").value.trim()};
  const email = {host: $("#emHost").value.trim(), port: $("#emPort").value.trim() || "587", user: $("#emUser").value.trim(),
                 password: $("#emPass").value, from_address: $("#emFrom").value.trim(), security: $("#emSec").value};
  const jobs = [];
  if (wa.phone_number_id && wa.token) jobs.push({channel: "whatsapp", driver: "meta", config: wa, enabled: $("#waEnable").checked});
  if (sms.sid && sms.token && sms.from_number) jobs.push({channel: "sms", driver: "twilio", config: sms, enabled: true});
  if (email.host && email.user) jobs.push({channel: "email", driver: "smtp", config: email, enabled: true});
  if (!jobs.length) { toast("Fill in the fields for at least one channel", "bad"); return; }
  try {
    for (const j of jobs) await api("/api/settings/channels", {method: "POST", body: j});
    closeModal(); toast("Providers saved — Rebuy will use them on the next send", "ok"); render("/settings");
  } catch (e) { toast(e.message, "bad"); }
}

function exportCsv(path, name) {
  api(path).then(d => {
    const rows = d.rows || [];
    if (!rows.length) { toast("Nothing to export", "bad"); return; }
    const cols = Object.keys(rows[0]);
    const csv = [cols.join(",")].concat(rows.map(r => cols.map(c => {
      const v = r[c] == null ? "" : String(r[c]);
      return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
    }).join(","))).join("\n");
    const blob = new Blob([csv], {type: "text/csv"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name + "_" + todayStr() + ".csv"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }).catch(e => toast(e.message, "bad"));
}

<script>
/* Register the Rebuy service worker. Wrapped so a blocked registration (Safari
   private mode, an embedded webview, an insecure origin) can never throw and
   take the rest of the boot sequence down with it. */
(function () {
  if (!("serviceWorker" in navigator)) return;
  /* isSecureContext is true for https, localhost and 127.0.0.1 but false for a
     plain-http LAN address, which is exactly the case that must not register. */
  if (!window.isSecureContext) return;
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js", { scope: "/" }).then(function (reg) {
      /* A waiting worker means a new deploy is on the server; promote it on the
         next navigation instead of waiting for every tab to close. */
      if (reg.waiting) reg.waiting.postMessage("skip-waiting");
      reg.addEventListener("updatefound", function () {
        var sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", function () {
          if (sw.state === "installed" && navigator.serviceWorker.controller) {
            sw.postMessage("skip-waiting");
          }
        });
      });
    }).catch(function () { /* offline install support is a bonus, not a gate */ });
  });
})();
</script>
