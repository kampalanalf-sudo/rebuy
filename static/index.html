<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebuy — bring your customers back</title>
<style>
  :root{
    --brand:#5b3df5; --brand-dark:#3f28c4; --brand-50:#f2efff; --ink:#14131a; --muted:#6b6a7b;
    --line:#e6e4ef; --bg:#f7f7fb; --card:#ffffff; --ok:#0d9f6e; --ok-bg:#e6f7f0; --warn:#b7791f;
    --warn-bg:#fdf6e3; --bad:#d64545; --bad-bg:#fdecec; --info:#2563eb; --info-bg:#e8efff;
    --radius:14px; --shadow:0 1px 2px rgba(20,19,26,.06),0 8px 24px rgba(20,19,26,.06);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Ubuntu,sans-serif;color:var(--ink);
       background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  a{color:var(--brand);text-decoration:none}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d8d5e6;border-radius:8px}

  /* ---------- shell ---------- */
  #shell{display:flex;min-height:100vh}
  aside{width:232px;flex:0 0 232px;background:#15132a;color:#cfcce6;display:flex;flex-direction:column;
        position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff;font-weight:800;font-size:18px;letter-spacing:-.3px}
  .logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#7c5cff,#4c2ee0);display:grid;place-items:center;font-size:15px}
  .shopbox{margin:0 12px 12px;padding:10px 12px;border-radius:11px;background:#211e3d;border:1px solid #302c56}
  .shopbox .nm{color:#fff;font-weight:650;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shopbox .sub{font-size:11px;color:#9c98bd;display:flex;gap:6px;align-items:center;margin-top:2px}
  nav{flex:1;padding:4px 8px;overflow:auto}
  nav .sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7a76a0;padding:14px 12px 6px}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#c9c5e2;font-size:13.5px;cursor:pointer;
           margin-bottom:2px;text-decoration:none}
  .navitem:hover{background:#211e3d;color:#fff}
  .navitem.on{background:#2c2751;color:#fff;font-weight:600}
  .navitem .ic{width:18px;text-align:center;opacity:.9}
  .navitem .pill{margin-left:auto;background:#5b3df5;color:#fff;font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:700}
  .sidefoot{padding:12px;border-top:1px solid #272347;font-size:12px}
  .sidefoot a{color:#9c98bd;display:flex;gap:8px;align-items:center;padding:6px 4px}
  .sidefoot a:hover{color:#fff}
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header.top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);
              border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header.top h1{font-size:17.5px;margin:0;font-weight:700;letter-spacing:-.2px}
  header.top .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  header.top .grow{flex:1}
  .content{padding:22px 26px 60px;max-width:1500px;width:100%}
  @media (max-width:900px){
    aside{display:none}
    header.top{padding:12px 14px}
    .content{padding:14px}
    .mobile-nav{display:flex !important}
  }
  .mobile-nav{display:none;gap:6px;overflow:auto;padding:8px 12px;background:#15132a}
  .mobile-nav a{color:#cfcce6;font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;background:#211e3d}
  .mobile-nav a.on{background:#5b3df5;color:#fff}

  /* ---------- primitives ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .card .hd h3{margin:0;font-size:14px;font-weight:700}
  .card .hd .sub{font-size:12px;color:var(--muted)}
  .card .hd .grow{flex:1}
  .card .bd{padding:16px}
  .grid{display:grid;gap:14px}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21{grid-template-columns:2fr 1fr}
  @media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g2{grid-template-columns:1fr}}
  @media (max-width:620px){.g4,.g3{grid-template-columns:1fr}}
  .kpi{padding:15px 16px}
  .kpi .label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .kpi .value{font-size:25px;font-weight:750;letter-spacing:-.6px;margin-top:6px}
  .kpi .foot{font-size:11.5px;color:var(--muted);margin-top:4px}
  .kpi.brand{background:linear-gradient(135deg,#5b3df5,#7c5cff);border:0;color:#fff}
  .kpi.brand .label,.kpi.brand .foot{color:#ded7ff}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid var(--line);
       background:#fff;font-weight:600;font-size:13px;transition:.12s;white-space:nowrap}
  .btn:hover{border-color:#c9c4e0;background:#fbfaff}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-dark)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
  .btn.ghost:hover{background:var(--brand-50)}
  .btn.danger{color:var(--bad);border-color:#f3cccc}
  .btn.danger:hover{background:var(--bad-bg)}
  .btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;align-items:center;gap:9px}
  .row.wrap{flex-wrap:wrap}
  .spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
  label.f{display:block;font-size:12px;font-weight:600;color:#3d3b4d;margin-bottom:5px}
  .input,select.input,textarea.input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:0}
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,61,245,.12)}
  textarea.input{min-height:88px;resize:vertical}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
  .field{margin-bottom:13px}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:650;
         background:#f0eff7;color:#4b4960;white-space:nowrap}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.bad{background:var(--bad-bg);color:var(--bad)}
  .badge.info{background:var(--info-bg);color:var(--info)}
  .badge.brand{background:var(--brand-50);color:var(--brand-dark)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
  table.t{width:100%;border-collapse:collapse}
  table.t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
             font-weight:650;padding:9px 12px;border-bottom:1px solid var(--line);background:#fbfaff;white-space:nowrap}
  table.t td{padding:11px 12px;border-bottom:1px solid #f0eef7;vertical-align:middle}
  table.t tr:last-child td{border-bottom:0}
  table.t tr.click{cursor:pointer}
  table.t tr.click:hover td{background:#faf9ff}
  .scrollx{overflow-x:auto}
  .empty{padding:34px 16px;text-align:center;color:var(--muted)}
  .empty .big{font-size:26px;margin-bottom:6px}
  .mono{font-family:var(--mono);font-size:12px}
  .muted{color:var(--muted)}
  .tiny{font-size:11.5px}
  .nowrap{white-space:nowrap}
  .right{text-align:right}
  .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
  .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#fff;flex:0 0 32px}
  .bar{height:7px;border-radius:6px;background:#eeecf7;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:6px;background:var(--brand)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#4b4960}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
  .tab{padding:9px 13px;border-radius:9px 9px 0 0;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand)}
  .switch{position:relative;width:40px;height:22px;border-radius:20px;background:#d9d6e8;border:0;transition:.15s;flex:0 0 40px}
  .switch:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on{background:var(--brand)}
  .switch.on:after{left:21px}

  /* ---------- modal ---------- */
  #modals{position:fixed;inset:0;z-index:80;display:none}
  #modals.open{display:block}
  .scrim{position:absolute;inset:0;background:rgba(20,19,26,.45)}
  .modal{position:relative;margin:6vh auto;background:#fff;border-radius:16px;max-width:640px;width:calc(100% - 32px);
         max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.25)}
  .modal.wide{max-width:900px}
  .modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .modal header h3{margin:0;font-size:15.5px}
  .modal .body{padding:20px;overflow:auto}
  .modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:#fbfaff;border-radius:0 0 16px 16px}
  .x{margin-left:auto;border:0;background:#f2f0fa;width:28px;height:28px;border-radius:8px;font-size:15px;line-height:1}

  /* ---------- toast ---------- */
  #toasts{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:380px}
  .toast{background:#1d1b2e;color:#fff;padding:11px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);
         animation:slide .18s ease-out}
  .toast.ok{background:#0d7a56}.toast.bad{background:#b23b3b}
  @keyframes slide{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

  /* ---------- auth ---------- */
  .authwrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
  @media (max-width:900px){.authwrap{grid-template-columns:1fr}.authside{display:none}}
  .authside{background:linear-gradient(150deg,#1a1734,#2b2160 55%,#4b2fbf);color:#fff;padding:44px;display:flex;flex-direction:column}
  .authside h2{font-size:31px;line-height:1.18;letter-spacing:-.9px;margin:26px 0 12px;max-width:440px}
  .authside p{color:#cfc8f5;max-width:420px;font-size:14.5px}
  .authside .feat{display:flex;gap:11px;margin-top:16px;font-size:13.5px;color:#e6e1ff;align-items:flex-start}
  .authside .feat .tick{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:11px;flex:0 0 20px}
  .authmain{display:flex;align-items:center;justify-content:center;padding:34px 24px}
  .authcard{width:100%;max-width:400px}
  .authcard h2{margin:0 0 4px;font-size:22px;letter-spacing:-.4px}
  .demo-creds{margin-top:16px;padding:12px 14px;background:var(--brand-50);border:1px solid #ddd5ff;border-radius:11px;font-size:12.5px}
  .demo-creds b{display:block;margin-bottom:4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand-dark)}

  /* ---------- dashboard bits ---------- */
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media (max-width:820px){.quick{grid-template-columns:repeat(2,1fr)}}
  .quick a{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff;display:block;color:inherit;transition:.12s}
  .quick a:hover{border-color:#c9c0ff;box-shadow:0 6px 18px rgba(91,61,245,.12);transform:translateY(-1px)}
  .quick .ic{width:30px;height:30px;border-radius:9px;background:var(--brand-50);color:var(--brand-dark);display:grid;place-items:center;font-size:15px;margin-bottom:8px}
  .quick .tt{font-weight:650;font-size:13px}
  .quick .ss{font-size:11.5px;color:var(--muted);margin-top:1px}
  .msgfeed{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding-right:4px}
  .bubble{max-width:86%;padding:9px 12px;border-radius:12px;font-size:12.8px;position:relative;white-space:pre-wrap;word-break:break-word}
  .bubble.out{background:#eeebff;border-bottom-left-radius:4px;align-self:flex-start}
  .bubble.in{background:#e8f7f0;border-bottom-right-radius:4px;align-self:flex-end}
  .bubble .mt{font-size:10px;color:var(--muted);margin-top:4px}
  .bubble a{word-break:break-all}
  .dayago{font-size:11px;color:var(--muted);text-align:center;margin:4px 0}
  .timeline{position:relative;padding-left:18px}
  .timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:#eceaf6}
  .tl{position:relative;padding:0 0 14px}
  .tl:before{content:"";position:absolute;left:-16px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 2px #e6e1ff}
  .tl .tt{font-weight:600;font-size:12.8px}
  .tl .ss{font-size:11.5px;color:var(--muted)}
  .statline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eeecf7;font-size:13px}
  .statline:last-child{border-bottom:0}
  .statline b{font-weight:650}
  .invoice-total{font-size:22px;font-weight:750;letter-spacing:-.5px}
  .mini{display:flex;flex-wrap:wrap;gap:6px}
  .hr{height:1px;background:var(--line);margin:14px 0}
  .copybox{background:#0f1020;color:#cfd3ff;padding:10px 12px;border-radius:9px;font-family:var(--mono);font-size:11.5px;
           word-break:break-all;position:relative}
  details.adv{border:1px solid var(--line);border-radius:11px;padding:0;margin-bottom:12px;background:#fff}
  details.adv summary{padding:12px 14px;cursor:pointer;font-weight:650;font-size:13px}
  details.adv[open] summary{border-bottom:1px solid var(--line)}
  details.adv .inner{padding:14px}
  .recent-li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #f3f1fa}
  .recent-li:last-child{border-bottom:0}
  .recent-li .grow{flex:1;min-width:0}
  .recent-li .nm{font-weight:600;font-size:12.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recent-li .ss{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sr{position:relative}
  .sr input{padding-left:32px}
  .sr .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
  .pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  .selbar{display:none;align-items:center;gap:9px;padding:9px 12px;background:var(--brand-50);border:1px solid #ddd5ff;border-radius:10px;margin-bottom:10px;font-size:12.5px}
  .selbar.on{display:flex}
  .stat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .tile{border:1px solid var(--line);border-radius:11px;padding:11px 12px}
  .tile .v{font-size:19px;font-weight:700;letter-spacing:-.4px}
  .tile .l{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modals"><div class="scrim" onclick="closeModal()"></div><div id="modalslot"></div></div>
<div id="toasts"></div>
<script>
"use strict";
/* ===================================================================== helpers */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money = (n, cur) => {
  const c = cur || (S.shop && S.shop.currency) || "UGX";
  const v = Number(n || 0);
  const s = Math.abs(v) >= 1000 ? v.toLocaleString("en-US", {maximumFractionDigits: 0}) : v.toLocaleString("en-US", {maximumFractionDigits: 2});
  return v < 0 ? "-" + c + " " + s : c + " " + s;
};
const num = n => Number(n || 0).toLocaleString("en-US");
const pct = n => (n == null ? "—" : Number(n).toFixed(1) + "%");
/* a JS string literal that is safe inside a double-quoted HTML attribute */
const jsq = s => JSON.stringify(String(s == null ? "" : s)).replace(/"/g, "&quot;");
const dt = s => {
  if (!s) return "—";
  const d = new Date(String(s).replace(" ", "T"));
  if (isNaN(d)) return String(s).slice(0, 16);
  const now = new Date();
  const days = Math.floor((now - d) / 86400000);
  if (days === 0 && String(s).length > 10) return d.toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"});
  if (days === 0) return "today";
  if (days === 1) return "yesterday";
  if (days > 0 && days < 7) return days + "d ago";
  return d.toLocaleDateString("en-GB", {day: "2-digit", month: "short", year: d.getFullYear() !== now.getFullYear() ? "numeric" : undefined});
};
const datef = s => s ? new Date(String(s).replace(" ", "T")).toLocaleDateString("en-GB", {day: "2-digit", month: "short", year: "numeric"}) : "—";
const initials = n => (n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
const AV_COLORS = ["#5b3df5","#0d9f6e","#e0782f","#2563eb","#c2418b","#b7791f","#0e7490","#7c3aed"];
const avColor = s => AV_COLORS[Math.abs(String(s || "").split("").reduce((a, c) => a + c.charCodeAt(0), 0)) % AV_COLORS.length];
const avatar = (n, size) => `<div class="avatar" style="background:${avColor(n)};${size ? `width:${size}px;height:${size}px;flex:0 0 ${size}px;font-size:${size * .38}px` : ""}">${esc(initials(n))}</div>`;
const RISK = {new: ["new", ""], healthy: ["healthy", "ok"], due: ["due soon", "info"], overdue: ["overdue", "warn"],
              at_risk: ["at risk", "bad"], lost: ["lost", "bad"]};
const riskBadge = b => { const [l, c] = RISK[b] || [b || "—", ""]; return `<span class="badge ${c}"><span class="dot"></span>${l}</span>`; };
const CHAN_ICON = {whatsapp: "🟢", sms: "📱", email: "✉️"};
const STATUS_BADGE = {scheduled: "", sent: "info", delivered: "ok", replied: "brand", converted: "ok", failed: "bad",
                      cancelled: "", skipped: "", superseded: "", queued: "warn", pending: "", opened: "info", bounced: "bad"};

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "bad" ? 5200 : 3200);
}

async function api(path, opts) {
  opts = opts || {};
  const init = {method: opts.method || "GET", headers: {"accept": "application/json"}, credentials: "same-origin"};
  if (opts.body !== undefined) { init.headers["content-type"] = "application/json"; init.body = JSON.stringify(opts.body); }
  const r = await fetch(path, init);
  let data = null;
  const text = await r.text();
  try { data = text ? JSON.parse(text) : {}; } catch (e) { data = {error: text.slice(0, 300)}; }
  if (!r.ok) {
    const err = new Error((data && (data.message || data.error)) || ("HTTP " + r.status));
    err.status = r.status; err.data = data;
    throw err;
  }
  return data;
}

function openModal(title, bodyHtml, footerHtml, wide) {
  $("#modalslot").innerHTML = `<div class="modal ${wide ? "wide" : ""}"><header><h3>${esc(title)}</h3>
    <button class="x" onclick="closeModal()">✕</button></header>
    <div class="body">${bodyHtml}</div>${footerHtml ? `<footer>${footerHtml}</footer>` : ""}</div>`;
  $("#modals").classList.add("open");
}
function closeModal() { $("#modals").classList.remove("open"); $("#modalslot").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* ===================================================================== state */
const S = {
  user: null, shop: null, route: "", days: 30, cache: {},

function shell(inner) {
  const shop = S.shop || {};
  const which = "/" + (S.route.split("/")[1] || "dashboard");
  const secs = [];
  let cur = [];
  for (const n of NAV) {
    if (n.sec) { if (cur.length) secs.push(cur); cur = [n]; } else cur.push(n);
  }
  if (cur.length) secs.push(cur);
  let navHtml = "";
  for (const group of secs) {
    const head = group[0].sec;
    if (head) navHtml += `<div class="sec">${esc(head)}</div>`;
    for (const n of group.slice(head ? 1 : 0)) {
      const badge = n.badgeKey && S.notice && S.notice[n.badgeKey] ? `<span class="pill">${S.notice[n.badgeKey]}</span>` : "";
      const on = n.r === which || (which === "/onboarding" && n.r === "/dashboard");
      navHtml += `<a class="navitem ${on ? "on" : ""}" href="#${n.r}"><span class="ic">${n.ic}</span>${esc(n.label)}${badge}</a>`;
    }
  }
  const mobile = `<div class="mobile-nav">${NAV.filter(n => n.r).map(n => `<a href="#${n.r}" class="${n.r === which ? "on" : ""}">${esc(n.label)}</a>`).join("")}</div>`;
  return `<div id="shell">
    <aside>
      <div class="logo"><span class="mark">↻</span> Rebuy</div>
      <div class="shopbox">
        <div class="nm">${esc(shop.name || "Your shop")}</div>
        <div class="sub">${esc(PLAN_NAMES[shop.plan] || shop.plan || "")} plan · <span class="badge ${shop.status === "active" ? "ok" : "warn"}" style="padding:0 6px">${esc(shop.status || "")}</span></div>
      </div>
      <nav>${navHtml}</nav>
      <div class="sidefoot">
        <a href="javascript:void 0" onclick="showHelp()">? Help & how it works</a>
        <a href="javascript:void 0" onclick="logout()">⏻ Sign out</a>
      </div>

    <main>

        <div><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>
        <div class="grow"></div>
        <div class="row" style="gap:8px">

          <a class="btn primary sm" href="#/sales/new">+ New sale</a>
        </div>

      <div class="content" id="view">${inner}</div>
    </main>

}

  if (t) t.textContent = title;
  if (s) s.textContent = sub || "";
}

/* ===================================================================== router */
const ROUTES = {};
function page(path, opts, render) { ROUTES[path] = Object.assign({render}, opts || {}); }

async function boot() {
  // top-level error surface
  window.addEventListener("unhandledrejection", ev => {
    const e = ev.reason || {};
    if (e && e.status) { toast(e.message || "Request failed", "bad"); ev.preventDefault(); }
  });
  const path = (location.hash || "#/dashboard").slice(1) || "/dashboard";
  S.route = path;
  const isOpenRoute = ["/login", "/signup", "/onboarding", "/admin", "/forgot", "/reset"].includes("/" + path.split("/")[1]);
  try {
    const me = await api("/api/auth/me");
    S.meta = {google_enabled: !!me.google_enabled, signup_open: me.signup_open !== false};
    if (me.authenticated) {
      S.user = me.user; S.shop = me.shop;
      if (S.user.role === "admin" && path.split("/")[1] !== "admin") { location.hash = "#/admin"; return; }
    }
  } catch (e) { /* offline: fall through */ }
  if (!S.user && !isOpenRoute) { location.hash = "#/login"; return; }
  if (S.user && ["/login", "/signup"].includes(path.split("?")[0])) { location.hash = S.user.role === "admin" ? "#/admin" : "#/dashboard"; return; }
  if (S.user) refreshNotice();
  render(path);
}

function render(path) {
  S.route = path;
  const parts = path.split("/").filter(Boolean);           // e.g. ["customers","12"]
  const key = "/" + (parts[0] || "dashboard");
  const spec = ROUTES[key] || ROUTES["/dashboard"];
  const ctx = {parts, rest: parts.slice(1), path};
  const app = $("#app");
  try {
    const out = spec.render(ctx);
    if (out && typeof out.then === "function") {
      app.innerHTML = `<div style="padding:60px;text-align:center;color:var(--muted)">Loading…</div>`;
      out.then(html => { app.innerHTML = html; if (spec.mount) spec.mount(ctx); })
         .catch(err => { app.innerHTML = shell(`<div class="card"><div class="bd"><b>Could not load this page.</b><div class="muted mt8">${esc(err.message || err)}</div></div></div>`); });
    } else {
      app.innerHTML = out;
      if (spec.mount) spec.mount(ctx);
    }
  } catch (err) {
    app.innerHTML = `<div class="card"><div class="bd"><b>Page error</b><div class="muted mt8">${esc(err.message || err)}</div></div></div>`;
  }
  const meta = PAGES["/" + (parts[0] || "dashboard")];
  if (meta) setPage(meta[0], meta[1]);
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", () => {
  const path = (location.hash || "#/dashboard").slice(1) || "/dashboard";
  if (!S.user && !["/login", "/signup", "/onboarding", "/admin"].includes("/" + path.split("/")[1])) {
    location.hash = "#/login"; return;
  }
  render(path);
});

async function refreshNotice() {
  try {
    const [shop, dash] = await Promise.all([api("/api/shop"), api("/api/inbox?unread=1")]);
    S.shop = shop.shop;
    S.notice = {unread: dash.unread_unread || (dash.unread && dash.unread.length) || 0,
                due_reminders: shop.counts ? shop.counts.reminders_due : 0};
    $$(".navitem").forEach(a => {
      const k = (NAV.find(n => a.getAttribute("href") === "#" + n.r) || {}).badgeKey;
      if (k) {
        const v = S.notice[k] || 0;
        let pill = $(".pill", a);
        if (v) { if (!pill) { pill = document.createElement("span"); pill.className = "pill"; a.appendChild(pill); } pill.textContent = v; }
        else if (pill) pill.remove();
      }
    });
  } catch (e) { /* ignore */ }
}

async function runTick(verbose) {
  try {
    const r = await api("/api/reminders/run", {method: "POST"});
    const s2 = r.stats || {};
    toast(`Queue processed — ${s2.dispatched || 0} messages sent${s2.errors ? ` · ${s2.errors} errors` : ""}`, "ok");
    if (verbose) setTimeout(() => location.reload(), 700);
    else refreshNotice();
  } catch (e) { toast(e.message, "bad"); }
}

async function logout() {
  try { await api("/api/auth/logout", {method: "POST"}); } catch (e) {}
  S.user = null; S.shop = null;
  location.hash = "#/login";
}

async function doLogin(ev) {
  ev.preventDefault();
  const f = ev.target;
  const btn = $("button[type=submit]", f);
  btn.disabled = true; btn.textContent = "Signing in…";
  try {
    const r = await api("/api/auth/login", {method: "POST", body: {email: f.email.value.trim(), password: f.password.value}});
    S.user = r.user; S.shop = r.shop;
    if (r.user.role === "admin") location.hash = "#/admin";
    else location.hash = r.shop && !r.shop.onboarded_at ? "#/onboarding" : "#/dashboard";
  } catch (e) {
    toast(e.message || "Could not sign in", "bad");
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

async function doSignup(ev) {
  ev.preventDefault();
  const f = ev.target;
  const btn = $("button[type=submit]", f);
  btn.disabled = true; btn.textContent = "Creating…";
  try {
    const body = {};
    for (const el of f.elements) if (el.name) body[el.name] = el.value;
    const r = await api("/api/signup", {method: "POST", body});
    S.user = r.user; S.shop = r.shop;
    toast("Shop created — let's get you set up", "ok");
    location.hash = "#/onboarding";
  } catch (e) { toast(e.message || "Could not create the shop", "bad"); btn.disabled = false; btn.textContent = "Create my shop →"; }
}

let CHART_DATA = null;
function drawRevenueChart() {
  const el = $("#chart1");
  if (!el || !CHART_DATA) return;
  const {sales, msgs} = CHART_DATA;
  const w = el.clientWidth || 600, h = 180, pad = 26;
  const maxS = Math.max(1, ...sales.map(p => p.value));
  const maxM = Math.max(1, ...msgs.map(p => p.value));
  const n = Math.max(sales.length, 1);
  const bw = Math.max(2, (w - pad * 2) / n - 3);
  const x = i => pad + i * ((w - pad * 2) / n);
  const yS = v => h - 22 - (h - 34) * (v / maxS);
  const path = msgs.map((p, i) => `${i ? "L" : "M"}${(x(i) + bw / 2).toFixed(1)},${(h - 22 - (h - 34) * (p.value / maxM)).toFixed(1)}`).join(" ");
  el.innerHTML = `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b3df5"/><stop offset="1" stop-color="#8f7bff"/></linearGradient></defs>
    ${sales.map((p, i) => `<rect x="${x(i)}" y="${yS(p.v)}" width="${bw}" height="${Math.max(0, h - 22 - yS(p.v))}" rx="3" fill="url(#g1)" opacity=".92"><title>${p.d}: ${money(p.value)}</title></rect>`).join("")}
    <path d="${path}" fill="none" stroke="#0d9f6e" stroke-width="2" stroke-linejoin="round"><title>messages</title></path>
    <line x1="${pad}" x2="${w - pad}" y1="${h - 22}" y2="${h - 22}" stroke="#e6e4ef"/>
    <text x="${pad}" y="${h - 6}" font-size="10" fill="#6b6a7b">${sales.length ? sales[0].day : ""}</text>
    <text x="${w - pad}" y="${h - 6}" font-size="10" fill="#6b6a7b" text-anchor="end">${sales.length ? sales[sales.length - 1].day : ""}</text>
  </svg>
  <div class="row mt8" style="gap:16px"><span class="tiny muted"><span class="dot" style="color:#5b3df5"></span> Sales (max ${money(maxS)})</span>
  <span class="tiny muted"><span class="dot" style="color:#0d9f6e"></span> Messages sent (max ${maxM})</span></div>`;
}

function donut(parts) {
  const total = parts.reduce((a, p) => a + p.n, 0) || 1;
  let acc = 0;
  const segs = parts.map(p => {
    const frac = p.n / total, start = acc; acc += frac;
    return {p, start};
  });
  const r = 42, c = 50, circ = 2 * Math.PI * r;
  return `<svg width="112" height="112" viewBox="0 0 100 100"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#f0eef7" stroke-width="14"/>
  ${segs.map(s => `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.p.color}" stroke-width="14"
     stroke-dasharray="${(s.p.n / total * circ).toFixed(2)} ${circ.toFixed(2)}" stroke-dashoffset="${(-s.start * circ).toFixed(2)}"
     transform="rotate(-90 ${c} ${c})"><title>${esc(s.p.label)}: ${s.p.n}</title></circle>`).join("")}
  <text x="${c}" y="${c + 1}" text-anchor="middle" font-size="15" font-weight="700" fill="#14131a">${num(total)}</text>
  <text x="${c}" y="${c + 13}" text-anchor="middle" font-size="7" fill="#6b6a7b">CUSTOMERS</text></svg>`;
}

function table(cols, rows, onclick, emptyMsg) {
  if (!rows || !rows.length) return `<div class="empty"><div class="big">◎</div>${esc(emptyMsg || "Nothing here yet")}</div>`;
  return `<table class="t"><thead><tr>${cols.map(c => `<th>${esc(c[0])}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(r => `<tr class="${onclick ? "click" : ""}" ${onclick ? `onclick="${onclick(r)}"` : ""}>${cols.map(c => `<td>${c[1](r)}</td>`).join("")}</tr>`).join("")}
  </tbody></table>`;
}

function linkify(s) {
  return esc(s || "").replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, "<br>");
}

async function sendReply(cid) {
  const box = $("#replyBox");
  const body = (box.value || "").trim();
  if (!body) return;
  try {
    await api("/api/customers/" + cid + "/message", {method: "POST", body: {body}});
    toast("Message queued & sent", "ok");
    render("/inbox/" + cid);
  } catch (e) { toast(e.message, "bad"); }
}

async function loadReminders(tab) {
  $$("[id^=rtab-]").forEach(c => c.classList.toggle("on", c.id === "rtab-" + tab));
  const box = $("#remTable");
  if (!box) return;
  box.innerHTML = `<div class="empty">Loading…</div>`;
  const d = await api("/api/reminders?" + (tab === "due" ? "due=today" : tab === "all" ? "" : "status=" + tab) + "&limit=120");
  const rows = d.rows || [];
  box.innerHTML = `<table class="t"><thead><tr><th>Due</th><th>Customer</th><th>Reason</th><th>Channel</th><th>Status</th><th class="right">Actions</th></tr></thead><tbody>
    ${rows.map(r => `<tr>
      <td class="nowrap">${r.due_on <= todayStr() ? `<span class="badge warn">${dt(r.due_on)}</span>` : dt(r.due_on)}</td>
      <td><a href="#/customers/${r.customer_id}"><b>${esc(r.customer)}</b></a><div class="tiny muted">${esc(r.phone || "")}</div></td>
      <td>${esc(r.product_name || r.kind)} <span class="badge">${esc(r.kind)}</span></td>
      <td><span class="badge">${CHAN_ICON[r.channel] || ""} ${esc(r.channel)}</span></td>
      <td><span class="badge ${STATUS_BADGE[r.status] || ""}">${esc(r.status)}</span></td>
      <td class="right nowrap">
        ${["scheduled", "failed"].includes(r.status) ? `<button class="btn sm primary" onclick="sendReminder(${r.id})">Send now</button>
          <button class="btn sm" onclick="snoozeReminder(${r.id})">Snooze</button>
          <button class="btn sm danger" onclick="skipReminder(${r.id})">Skip</button>` : `<a class="btn sm" href="#/customers/${r.customer_id}">View</a>`}
      </td></tr>`).join("") || `<tr><td colspan="6"><div class="empty"><div class="big">⏰</div>Nothing in this queue</div></td></tr>`}
  </tbody></table>`;
}
const todayStr = () => new Date().toISOString().slice(0, 10);
const daysFromNow = n => new Date(Date.now() + n * 86400000).toISOString().slice(0, 10);
async function toggleAuto(v) {
  try { await api("/api/shop", {method: "PATCH", body: {auto_reminders: v}}); S.shop.auto_reminders = v; toast(v ? "Auto-reminders on" : "Auto-reminders paused", "ok"); location.reload(); }

let SALE = {cid: null, lines: []};
function mountSaleNew() {
  if (!SALE.lines.length) SALE.lines = [{name: "", price: "", qty: 1, unit: "pc", cycle: "", kind: "goods"}];
  if (location.hash.indexOf("?") > -1) {
    const cid = new URLSearchParams(location.hash.split("?")[1]).get("customer");
    if (cid) { SALE.cid = Number(cid); pickCust($("#saleCustSearch").value); }
  }
  renderLines();
}
function addLine(pre) {
  if (pre && pre.name) {
    const existing = SALE.lines.find(l => l.name === pre.name && !l.price);
    if (existing) { existing.price = pre.price; existing.cycle = pre.cycle; renderLines(); return; }
    SALE.lines.push({name: pre.name, price: pre.price, qty: 1, unit: pre.unit || "pc", cycle: pre.cycle || "", kind: pre.kind || "goods"});
  } else {
    SALE.lines.push({name: "", price: "", qty: 1, unit: "pc", cycle: "", kind: "goods"});
  }
  renderLines();
}
function removeLine(i) { SALE.lines.splice(i, 1); renderLines(); }
function renderLines() {
  const box = $("#saleLines");
  if (!box) return;
  if (!SALE.lines.length) SALE.lines.push({name: "", price: "", qty: 1, unit: "pc", cycle: "", kind: "goods"});
  box.innerHTML = SALE.lines.map((l, i) => `<div class="row mb8" style="gap:7px;align-items:flex-start">
    <input class="input" style="flex:2.2" placeholder="Item or service name" value="${esc(l.name)}" oninput="SALE.lines[${i}].name=this.value">
    <input class="input" style="flex:.7" type="number" step="0.01" placeholder="Qty" value="${esc(l.qty)}" oninput="SALE.lines[${i}].qty=this.value;calcTotal()">
    <input class="input" style="flex:1" type="number" step="0.01" placeholder="Unit price" value="${esc(l.price)}" oninput="SALE.lines[${i}].price=this.value;calcTotal()">
    <input class="input" style="flex:.8" type="number" placeholder="Cycle days" title="How long this lasts before the customer needs it again" value="${esc(l.cycle)}" oninput="SALE.lines[${i}].cycle=this.value">
    <button class="btn sm danger" onclick="removeLine(${i})">✕</button></div>`).join("");
  calcTotal();
}
function calcTotal() {
  const t = SALE.lines.reduce((a, l) => a + (Number(l.qty || 0) * Number(l.price || 0)), 0);
  const el = $("#saleTotal"); if (el) el.innerHTML = `Total: <b>${money(t)}</b>`;
}
function pickCust(v) {
  const opt = $$("#custList option").find(o => o.value === v);

async function submitSale() {
  const lines = SALE.lines.filter(l => (l.name || "").trim());
  if (!lines.length) { toast("Add at least one item", "bad"); return; }
  const body = {
    customer_id: SALE.cid || undefined,
    customer_name: $("#newCustName") ? $("#newCustName").value : "",
    customer_phone: $("#newCustPhone") ? $("#newCustPhone").value : "",
    customer_email: $("#newCustEmail") ? $("#newCustEmail").value : "",
    date: $("#saleDate").value, receipt_no: $("#saleReceipt").value,

    items: lines.map(l => ({product_name: l.name, qty: Number(l.qty || 1), unit_price: Number(l.price || 0),
                            cycle_days: l.cycle ? Number(l.cycle) : undefined, kind: l.kind, unit: l.unit})),
  };
  if (!SALE.cid) {
    // let the API create the customer from the typed details (or a walk-in name)
    body.customer_name = body.customer_name || ($("#saleCustSearch") ? $("#saleCustSearch").value.split(" · ")[0] : "") || "Walk-in customer";
  }
  try {

    toast(`Sale recorded · ${r.reminders_planned} reminder(s) scheduled`, "ok");
    SALE = {cid: null, lines: []};

}

async function buildCampaign(opts) {

     <button class="btn" onclick="previewCampaign()">Preview</button>
     <button class="btn primary" onclick="sendCampaign()">Create &amp; send</button>`);

}
async function previewSegment() {
  const seg = (window.__segments || []).find(s => s.key === $("#campSeg").value) || {};
  try {
    const r = await api("/api/campaigns/preview", {method: "POST", body: {segment: seg.segment || {}}});
    $("#campAudience").textContent = num(r.count || 0) + " recipients";
  } catch (e) { $("#campAudience").textContent = "—"; }
}
async function previewCampaign() {
  const r = await api("/api/templates/preview", {method: "POST", body: {body: $("#campMsg").value}});
  openModal("Preview", `<div class="bubble out" style="max-width:100%">${linkify(r.rendered || r.text || $("#campMsg").value)}</div>

    `<button class="btn" onclick="buildCampaignAgain()">Back to editing</button>`);
}
function buildCampaignAgain() { closeModal(); buildCampaign(); }
async function sendCampaign() {
  const seg = (window.__segments || []).find(s => s.key === $("#campSeg").value) || {};
  const msg = $("#campMsg").value;
  const firstLine = (msg.split("\n")[0] || "A quick update").slice(0, 70);
  const body = {name: $("#campName").value || "Campaign " + new Date().toLocaleDateString("en-GB"),
                segment: seg.segment || {}, template_key: "broadcast", channel: "whatsapp", status: "draft"};
  try {
    const c = await api("/api/campaigns", {method: "POST", body});
    const cid = c.campaign.id;
    const r = await api(`/api/campaigns/${cid}/send`, {method: "POST", body: {
      headline: firstLine, body: msg,
      coupon_percent: $("#campCoupon").checked ? Number($("#campPct").value || 0) : 0}});
    closeModal();
    toast(`Campaign queued for ${num(r.queued || 0)} of ${num(r.recipients || 0)} customers`, "ok");
    render("/segments");
  } catch (e) { toast(e.message, "bad"); }
}

function pickFile(inp) {
  const f = inp.files[0];
  if (!f) return;
  uploadFile(f);
}
function dropFile(ev) {
  ev.preventDefault();
  $("#drop").style.borderColor = "#d5d0ea";
  const f = ev.dataTransfer.files[0];
  if (f) uploadFile(f);
}
function readAsDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
}
async function uploadFile(file) {
  const box = $("#importPreview");
  box.innerHTML = `<div class="empty">Reading ${esc(file.name)}…</div>`;
  try {
    const data = await readAsDataURL(file);
    const prev = await api("/api/import/preview", {method: "POST", body: {filename: file.name, data}});
    box.innerHTML = `<div class="card"><div class="hd"><h3>Found ${num(prev.rows_found)} rows in ${esc(file.name)}</h3></div><div class="bd">
      <div class="row wrap tiny mb12" style="gap:8px">${Object.entries(prev.mapping || {}).map(([k, v]) => `<span class="badge info">${esc((prev.headers || [])[v] || v)} → ${esc(k)}</span>`).join("")}</div>

        ${(prev.sample || []).map(r => `<tr><td class="mono">${esc(r.receipt_no || "—")}</td><td>${esc(r.date || "")}</td><td>${esc(r.name || "")}</td>
          <td class="tiny">${esc(r.phone || "")}</td><td>${esc(r.product || "")}</td><td>${esc(r.qty || "")}</td><td>${esc(r.line_total || "")}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="row mt12"><span class="badge">${num(prev.groups)} receipts detected</span><div class="grow"></div>
        <button class="btn primary" onclick="commitImport('${esc(file.name)}', this)">Import ${num(prev.rows_found)} rows →</button></div>
    </div></div>`;
    window.__pendingFile = {data, name: file.name};
  } catch (e) { box.innerHTML = `<div class="card"><div class="bd"><b>Could not read that file.</b><div class="tiny muted mt8">${esc(e.message)}</div></div></div>`; }
}
async function commitImport(name, btn) {
  const f = window.__pendingFile;
  if (!f) return;
  btn.disabled = true; btn.textContent = "Importing…";
  try {
    const r = await api("/api/import/file", {method: "POST", body: {filename: f.name, data: f.data}});
    toast(`Imported ${num((r.report && r.report.sales) || 0)} sales · ${num((r.report && r.report.customers) || 0)} customers · ${num((r.report && r.report.reminders) || 0)} reminders`, "ok");
    render("/import");
  } catch (e) { toast(e.message, "bad"); btn.disabled = false; btn.textContent = "Try again"; }
}
function sampleCsv() {
  const today = new Date();
  const d = n => new Date(today - n * 86400000).toISOString().slice(0, 10);
  const who = [["Aisha Nabirye", "+256772445118", "Ntinda"], ["Brian Okello", "+256701882003", "Kireka"],
               ["Grace Atim", "+256782119944", "Bugolobi"], ["Moses Kaggwa", "+256703447812", "Nakawa"],
               ["Sandra Nansubuga", "+256775990210", "Muyenga"], ["Peter Wanyama", "+256787220145", "Kawempe"]];
  const items = [["Rice 2kg", "Grains & Flour", 12000, 1], ["Cooking oil 1L", "Cooking Oil", 8500, 1],
                 ["Sugar 1kg", "Sugar", 4500, 2], ["Maize flour 2kg", "Grains & Flour", 6000, 1],
                 ["Milk 500ml", "Dairy & Eggs", 2500, 4], ["Soap bar", "Personal Care", 3500, 1]];
  const rows = [["receipt_no", "date", "customer", "phone", "area", "item", "category", "qty", "price", "total", "payment"]];
  let n = 4000;
  for (let v = 0; v < 6; v++) {
    for (let k = 0; k < 2 + (v % 3); k++) {
      const [name, phone, area] = who[v];
      const [item, cat, price] = items[(v + k) % items.length];
      const qty = 1 + ((v + k) % 3);
      n++;
      rows.push(["R" + n, d(k * 12 + v * 2), name, phone, area, item, cat, qty, price, price * qty, k % 2 ? "cash" : "mobile money"]);
    }
  }
  return rows.map(r => r.join(",")).join("\n");
}

async function saveChannels() {
  const wa = {phone_number_id: $("#waPhoneId").value.trim(), token: $("#waToken").value.trim(), api_version: $("#waVer").value.trim() || "v21.0"};
  const sms = {sid: $("#smsSid").value.trim(), token: $("#smsToken").value.trim(), from_number: $("#smsFrom").value.trim()};
  const email = {host: $("#emHost").value.trim(), port: $("#emPort").value.trim() || "587", user: $("#emUser").value.trim(),
                 password: $("#emPass").value, from_address: $("#emFrom").value.trim(), security: $("#emSec").value};
  const jobs = [];
  if (wa.phone_number_id && wa.token) jobs.push({channel: "whatsapp", driver: "meta", config: wa, enabled: $("#waEnable").checked});
  if (sms.sid && sms.token && sms.from_number) jobs.push({channel: "sms", driver: "twilio", config: sms, enabled: true});
  if (email.host && email.user) jobs.push({channel: "email", driver: "smtp", config: email, enabled: true});
  if (!jobs.length) { toast("Fill in the fields for at least one channel", "bad"); return; }
  try {
    for (const j of jobs) await api("/api/settings/channels", {method: "POST", body: j});
    closeModal(); toast("Providers saved — Rebuy will use them on the next send", "ok"); render("/settings");
  } catch (e) { toast(e.message, "bad"); }
}

function exportCsv(path, name) {
  api(path).then(d => {
    const rows = d.rows || [];
    if (!rows.length) { toast("Nothing to export", "bad"); return; }
    const cols = Object.keys(rows[0]);
    const csv = [cols.join(",")].concat(rows.map(r => cols.map(c => {
      const v = r[c] == null ? "" : String(r[c]);
      return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
    }).join(","))).join("\n");
    const blob = new Blob([csv], {type: "text/csv"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name + "_" + todayStr() + ".csv"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }).catch(e => toast(e.message, "bad"));
}
