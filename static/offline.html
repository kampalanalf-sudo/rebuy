<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rebuy — offline</title>
<meta name="theme-color" content="#17111A">
<style>
  :root { color-scheme: dark; }
  html,body { height:100%; }
  body{
    margin:0;display:flex;align-items:center;justify-content:center;
    background:#17111A;color:#EDE6F2;
    font-family:Ubuntu,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    text-align:center;padding:32px;
  }
  .wrap{max-width:420px}
  .mark{width:88px;height:88px;margin:0 auto 26px;display:block;border-radius:22px;
        box-shadow:0 10px 30px rgba(233,84,32,.28)}
  h1{font-size:1.45rem;margin:0 0 10px;font-weight:500;letter-spacing:-.01em}
  p{color:#A99BB5;line-height:1.6;margin:0 0 26px;font-size:.95rem}
  button{
    font:inherit;font-size:.95rem;font-weight:500;cursor:pointer;
    padding:12px 26px;border-radius:10px;border:0;
    background:#E95420;color:#fff;transition:background .15s;
  }
  button:hover{background:#FF6B35}
  .hint{margin-top:22px;font-size:.8rem;color:#6F6479}
</style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="/icons/icon-192.png" alt="" width="88" height="88">
    <h1>You're offline</h1>
    <p>Rebuy needs a connection to load your customers and reminders. Your data is safe — reconnect and everything will be exactly where you left it.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="hint">Tip: reminders that were already sent are not affected.</div>
  </div>
</body>
</html>
