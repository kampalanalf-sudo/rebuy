  :root{
    --u-orange:#E95420; --u-orange-lt:#FF7A4D; --u-warm-grey:#AEA79F;

    --ink:#F7F2F5; --ink-2:#E4DCE6; --muted:#A79AAA; --muted-2:#7D6F82;
    --line:#372B3E; --line-2:#453550;
    --bg:#17111A; --card:#221A27; --card-2:#2A2030;
    --brand:#E95420; --brand-dark:#C7401A; --brand-50:rgba(233,84,32,.12);
    --accent:#8E5CE6;

    --ok:#4CC38A; --ok-bg:rgba(76,195,138,.13); --warn:#F2B33D; --warn-bg:rgba(242,179,61,.13);
    --bad:#FF6B6B; --bad-bg:rgba(255,107,107,.13); --info:#5B9DFF; --info-bg:rgba(91,157,255,.13);

    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.28);
    --glow:0 0 0 1px rgba(233,84,32,.28),0 10px 34px -8px rgba(233,84,32,.42);
    --mono:ui-monospace,SFMono-Regular,"Ubuntu Mono",Menlo,Consolas,monospace;
    --font:'Ubuntu',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);background:var(--bg);background-image:radial-gradient(1200px 600px at 12% -8%, rgba(142,92,230,.16), transparent 62%),radial-gradient(900px 520px at 96% 2%, rgba(233,84,32,.13), transparent 58%);background-attachment:fixed;
       color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  a{color:var(--brand);text-decoration:none}
  button,input,select,textarea{font:inherit;color:inherit}
  #shell{display:flex;min-height:100vh}
  aside{width:214px;flex:0 0 214px;background:linear-gradient(180deg,#1C1220 0%,#221629 52%,#2A0F22 100%);color:#c9c6dd;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:9px;padding:16px 16px 12px;color:#fff;font-weight:800;font-size:16px;letter-spacing:-.2px}
  .logo .mark{width:27px;height:27px;border-radius:8px;background:linear-gradient(140deg,#E95420,#B9340F);display:grid;place-items:center;font-size:14px}
  .logo .tag{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8b86b0;padding:2px 6px;border:1px solid #322c56;border-radius:5px;margin-left:2px}
  nav{padding:6px;flex:1;overflow:auto}
  .navitem{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:8px;color:#c9c6dd;font-size:13px;cursor:pointer;margin-bottom:2px}
  .navitem:hover{background:#1c1a30;color:#fff}
  .navitem.on{background:#292347;color:#fff;font-weight:600}
  .navitem .ic{width:16px;text-align:center;font-size:12px;opacity:.9}
  .navitem .pill{margin-left:auto;background:var(--brand);color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;font-weight:700}
  .sidefoot{padding:11px;border-top:1px solid #221e39;font-size:11.5px;color:#8b86b0}
  .sidefoot a{color:#a9a5c9;display:block;padding:4px 2px}
  .sidefoot a:hover{color:#fff}
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header.top{display:flex;align-items:center;gap:12px;padding:13px 22px;background:rgba(23,17,26,.78);backdrop-filter:saturate(160%) blur(14px);
              border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header.top h1{margin:0;font-size:17px;font-weight:500;letter-spacing:-.2px;color:var(--ink)}
  header.top .sub{font-size:12px;color:var(--muted)}
  header.top .grow{flex:1}
  .content{padding:18px 22px 50px;max-width:1560px;width:100%}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(17,16,24,.05)}
  .card .hd{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .card .hd h3{margin:0;font-size:13.5px;font-weight:700}
  .card .hd .grow{flex:1}
  .card .bd{padding:14px}
  .grid{display:grid;gap:12px}
  .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21{grid-template-columns:2fr 1fr}
  @media (max-width:1350px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:1050px){.g4,.g3,.g2,.g21{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:700px){.g6,.g4,.g3,.g2,.g21{grid-template-columns:1fr}aside{display:none}.content{padding:12px}header.top{padding:10px 12px}}
  .kpi{padding:12px 13px}
  .kpi .l{font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:center}
  .kpi .v{font-size:21px;font-weight:750;letter-spacing:-.5px;margin-top:5px;line-height:1.15}
  .kpi .f{font-size:10.5px;color:var(--muted);margin-top:3px}
  .kpi.brand{background:linear-gradient(140deg,#E95420,#C7401A 48%,#8C2A10 100%);border:0;color:#fff}
  .kpi.brand .l,.kpi.brand .f{color:#ded7ff}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card-2);
       font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#c8c3df;background:rgba(255,255,255,.022)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-dark)}
  .btn.sm{padding:4px 8px;font-size:11.5px;border-radius:6px}
  .btn.danger{color:var(--bad);border-color:#f3cccc}
  .btn.dark{background:#15132a;border-color:#15132a;color:#fff}
  .row{display:flex;align-items:center;gap:8px}
  .row.wrap{flex-wrap:wrap}
  .grow{flex:1}
  .input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card-2);outline:0}
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,61,245,.12)}
  label.f{display:block;font-size:11.5px;font-weight:650;color:var(--ink-2);margin-bottom:4px}
  .field{margin-bottom:11px}
  .hint{font-size:11px;color:var(--muted);margin-top:3px}
  table.t{width:100%;border-collapse:collapse}
  table.t th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:650;
             padding:8px 10px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.022);white-space:nowrap}
  table.t td{padding:9px 10px;border-bottom:1px solid #f1eff8;vertical-align:middle}
  table.t tr:last-child td{border-bottom:0}
  table.t tbody tr.click{cursor:pointer}
  table.t tbody tr.click:hover td{background:rgba(255,255,255,.03)}
  .scrollx{overflow-x:auto}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:650;background:rgba(255,255,255,.03);color:var(--ink-2);white-space:nowrap}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.bad{background:var(--bad-bg);color:var(--bad)}
  .badge.info{background:var(--info-bg);color:var(--info)}
  .badge.brand{background:var(--brand-50);color:var(--brand-dark)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const num = n => Number(n || 0).toLocaleString("en-US");
const money = (n, cur) => {
  const c = cur || "UGX", v = Number(n || 0);
  return c + " " + (Math.abs(v) >= 1000 ? v.toLocaleString("en-US", {maximumFractionDigits: 0}) : v.toLocaleString("en-US", {maximumFractionDigits: 2}));
};
const pct = n => (n == null ? "—" : Number(n).toFixed(1) + "%");
const dt = s => {
  if (!s) return "—";
  const d = new Date(String(s).replace(" ", "T"));
  if (isNaN(d)) return String(s).slice(0, 16);
  const days = Math.floor((new Date() - d) / 86400000);
  if (days === 0 && String(s).length > 10) return d.toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"});
  if (days === 0) return "today";
  if (days === 1) return "yesterday";
  if (days > 0 && days < 7) return days + "d ago";
  return d.toLocaleDateString("en-GB", {day: "2-digit", month: "short", year: "numeric"});
};
const initials = n => (n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
const AV = ["#5b3df5","#0d9f6e","#e0782f","#2563eb","#c2418b","#b7791f","#0e7490","#7c3aed"];
const av = s => AV[Math.abs(String(s || "").split("").reduce((a, c) => a + c.charCodeAt(0), 0)) % AV.length];
const avatar = (n, size) => `<span style="display:inline-grid;place-items:center;border-radius:50%;background:${av(n)};color:#fff;font-weight:700;width:${size||26}px;height:${size||26}px;font-size:${((size||26)*.4).toFixed(0)}px;flex:0 0 ${size||26}px">${esc(initials(n))}</span>`;
const STATUS = {active: "ok", trial: "info", paused: "warn", churned: "bad", cancelled: "bad"};
const RISK = {new: "", healthy: "ok", due: "info", overdue: "warn", at_risk: "bad", lost: "bad"};

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "bad" ? 5200 : 3000);
}
async function api(path, opts) {
  opts = opts || {};
  const init = {method: opts.method || "GET", headers: {"accept": "application/json"}, credentials: "same-origin"};
  if (opts.body !== undefined) { init.headers["content-type"] = "application/json"; init.body = JSON.stringify(opts.body); }
  const r = await fetch(path, init);
  const text = await r.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch (e) { data = {error: text.slice(0, 300)}; }
  if (!r.ok) { const e = new Error(data.message || data.error || ("HTTP " + r.status)); e.status = r.status; throw e; }
  return data;
}

const PAGES = {
  "/overview": ["Platform overview", "Every shop, every message, every shilling recovered."],

async function doLogin(ev) {
  ev.preventDefault();
  const f = ev.target;
  try {
    await api("/api/auth/login", {method: "POST", body: {email: f.email.value.trim(), password: f.password.value}});

}

async function tickNow(btn) {
  btn.disabled = true;
  try {
    const r = await api("/api/admin/tick", {method: "POST", body: {}});
    const s = r.stats || {};
    toast(`Worker ran — ${s.dispatched || 0} sent, ${s.followups || 0} follow-ups, ${s.winbacks || 0} win-backs`, "ok");
    render(S.route);

async function reseed(btn) {
  if (!confirm("Generate a fresh demo fleet? This REPLACES all shops, customers and sales in this database.")) return;

    const r = await api("/api/admin/seed", {method: "POST", body: {shops: 120, reset: true}});

    render(S.route);

async function render(path) {
  S.route = path;
  const key = "/" + (path.split("/")[1] || "overview");
  const fn = ROUTES[key] || ROUTES["/overview"];
  const meta = PAGES[key] || PAGES["/overview"];
  const app = $("#app");
  try {
    const html = await fn(path.split("/").slice(2));
    app.innerHTML = html;
    const t = $("#pt"), s = $("#ps");
    if (t) t.textContent = meta[0];
    if (s) s.textContent = meta[1];
    window.scrollTo(0, 0);
  } catch (e) {
    app.innerHTML = `<div class="card"><div class="bd"><b>Could not load.</b><div class="muted tiny mt8">${esc(e.message)}</div>
      <button class="btn mt12" onclick="location.reload()">Reload</button></div></div>`;
  }
}
window.addEventListener("hashchange", () => render((location.hash || "#/overview").slice(1) || "/overview"));

function chart(series, msgSeries) {
  const w = 700, h = 170, pad = 24;
  if (!series.length) return `<div class="empty">No data</div>`;
  const max = Math.max(1, ...series.map(p => p.value));
  const mmax = Math.max(1, ...msgSeries.map(p => p.value));
  const n = series.length;
  const bw = Math.max(2, (w - pad * 2) / n - 2);
  const x = i => pad + i * ((w - pad * 2) / n);
  const y = v => h - 20 - (h - 30) * (v / max);
  const line = msgSeries.map((p, i) => `${i ? "L" : "M"}${(x(i) + bw / 2).toFixed(1)},${(h - 20 - (h - 30) * (p.value / mmax)).toFixed(1)}`).join(" ");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b3df5"/><stop offset="1" stop-color="#9a8cff"/></linearGradient></defs>
    ${series.map((p, i) => `<rect x="${x(i)}" y="${y(p.value)}" width="${bw}" height="${Math.max(0, h - 20 - y(p.value))}" rx="2" fill="url(#gg)"><title>${p.day}: ${money(p.value)}</title></rect>`).join("")}
    <path d="${line}" fill="none" stroke="#0d9f6e" stroke-width="1.8"/>
    <line x1="${pad}" x2="${w - pad}" y1="${h - 20}" y2="${h - 20}" stroke="#e5e3ee"/>
    <text x="${pad}" y="${h - 6}" font-size="9" fill="#6a6879">${series[0].day}</text>
    <text x="${w - pad}" y="${h - 6}" font-size="9" fill="#6a6879" text-anchor="end">${series[n - 1].day}</text>
  </svg>
  <div class="row mt8" style="gap:14px"><span class="tiny muted"><span class="dot" style="color:#5b3df5"></span> GMV</span>
  <span class="tiny muted"><span class="dot" style="color:#0d9f6e"></span> messages sent</span></div>`;
}

function credModal(channel, schema, driver, enabled) {
  const label = {whatsapp: "Meta WhatsApp Cloud API", sms: "Twilio SMS", email: "SMTP email"}[channel];
  openModal("Configure " + label, `
    <div class="field"><label class="f">Driver</label>
      <select class="input" id="cdDriver">
        <option value="sandbox" ${driver === "sandbox" ? "selected" : ""}>sandbox (simulated)</option>
        <option value="${channel === "whatsapp" ? "meta" : channel === "sms" ? "twilio" : "smtp"}" ${driver !== "sandbox" ? "selected" : ""}>${label}</option>
      </select></div>
    ${Object.entries(schema || {}).map(([k, hint]) => `<div class="field"><label class="f">${esc(k)}</label>
      <input class="input" id="cc_${esc(k)}" placeholder="${esc(hint)}" ${/token|password|secret/.test(k) ? 'type="password"' : ""}></div>`).join("")}
    <label class="row tiny" style="gap:6px;margin-top:6px"><input type="checkbox" id="cdEnabled" ${enabled ? "checked" : ""}> Enabled for all shops without their own credentials</label>
    <div class="hr"></div>
    <div class="row"><input class="input" id="cdTestTo" placeholder="test destination (+256… / email)"><button class="btn" onclick="testCred('${channel}')">Send test</button></div>
    <div class="tiny muted mt8" id="cdTestOut"></div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCred('${channel}')">Save credentials</button>`);
}
async function saveCred(channel) {
  const cfg = {};
  $$("[id^=cc_]").forEach(i => { if (i.value.trim()) cfg[i.id.slice(3)] = i.value.trim(); });
  try {
    await api("/api/admin/credentials", {method: "POST", body: {channel, driver: $("#cdDriver").value, config: cfg, enabled: $("#cdEnabled").checked}});
    closeModal(); toast("Credentials saved", "ok"); render("/credentials");
  } catch (e) { toast(e.message, "bad"); }
}
async function testCred(channel) {
  const cfg = {};
  $$("[id^=cc_]").forEach(i => { if (i.value.trim()) cfg[i.id.slice(3)] = i.value.trim(); });
  const out = $("#cdTestOut");
  out.textContent = "Sending…";
  try {
    const r = await api("/api/admin/credentials/test", {method: "POST", body: {channel, driver: $("#cdDriver").value, config: cfg, to: $("#cdTestTo").value}});
    out.innerHTML = r.ok ? `<span class="badge ok">sent</span> ${esc(r.detail || "")}` : `<span class="badge bad">failed</span> ${esc(r.detail || "")}`;
  } catch (e) { out.innerHTML = `<span class="badge bad">failed</span> ${esc(e.message)}`; }
}

    <input class="input" style="width:200px" id="auditFilter" placeholder="filter by action…" onkeydown="if(event.key==='Enter')loadAudit(this.value)"></div>
    <div class="scrollx"><table class="t"><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Shop</th><th>Detail</th></tr></thead><tbody>
    ${(d.rows || []).map(a => `<tr><td class="tiny nowrap">${dt(a.created_at)}</td><td class="tiny">${esc(a.actor || "")}</td>
      <td><span class="badge">${esc(a.action)}</span></td><td class="tiny">${esc(a.shop || (a.shop_id ? "#" + a.shop_id : "platform"))}</td>
      <td class="tiny muted" style="max-width:460px;white-space:normal">${esc((a.detail || "").slice(0, 200))}</td></tr>`).join("") || `<tr><td colspan="5"><div class="empty">Nothing logged yet</div></td></tr>`}
    </tbody></table></div></div>
  <div class="card mt16"><div class="hd"><h3>Action mix</h3></div><div class="bd">
    <div class="chips">${(d.actions || []).map(a => `<span class="chip">${esc(a.action)} · ${num(a.n)}</span>`).join("")}</div>
  </div></div>`);
});
async function loadAudit(q) {
  const d = await api("/api/admin/audit?limit=200&action=" + encodeURIComponent(q));
  toast(`Filtered: ${num((d.rows || []).length)} entries`, "ok");
  render("/audit");
}

if (document.readyState !== "loading") boot();

<script>
/* Register the Rebuy service worker. Wrapped so a blocked registration (Safari
   private mode, an embedded webview, an insecure origin) can never throw and
   take the rest of the boot sequence down with it. */
(function () {
  if (!("serviceWorker" in navigator)) return;
  /* isSecureContext is true for https, localhost and 127.0.0.1 but false for a
     plain-http LAN address, which is exactly the case that must not register. */
  if (!window.isSecureContext) return;
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js", { scope: "/" }).then(function (reg) {
      /* A waiting worker means a new deploy is on the server; promote it on the
         next navigation instead of waiting for every tab to close. */
      if (reg.waiting) reg.waiting.postMessage("skip-waiting");
      reg.addEventListener("updatefound", function () {
        var sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", function () {
          if (sw.state === "installed" && navigator.serviceWorker.controller) {
            sw.postMessage("skip-waiting");
          }
        });
      });
    }).catch(function () { /* offline install support is a bonus, not a gate */ });
  });
})();
</script>
