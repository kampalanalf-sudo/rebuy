<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebuy — platform admin</title>
<style>
  :root{
    --ink:#111018; --muted:#6a6879; --line:#e5e3ee; --bg:#f6f6fa; --card:#fff;
    --brand:#5b3df5; --brand-dark:#3f28c4; --brand-50:#f2efff;
    --ok:#0d9f6e; --ok-bg:#e6f7f0; --warn:#b7791f; --warn-bg:#fdf6e3; --bad:#d64545; --bad-bg:#fdecec;
    --info:#2563eb; --info-bg:#e8efff; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;background:var(--bg);
       color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  a{color:var(--brand);text-decoration:none}
  button,input,select,textarea{font:inherit;color:inherit}
  #shell{display:flex;min-height:100vh}
  aside{width:214px;flex:0 0 214px;background:#0f0e1a;color:#c9c6dd;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:9px;padding:16px 16px 12px;color:#fff;font-weight:800;font-size:16px;letter-spacing:-.2px}
  .logo .mark{width:27px;height:27px;border-radius:8px;background:linear-gradient(135deg,#7c5cff,#4c2ee0);display:grid;place-items:center;font-size:14px}
  .logo .tag{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8b86b0;padding:2px 6px;border:1px solid #322c56;border-radius:5px;margin-left:2px}
  nav{padding:6px;flex:1;overflow:auto}
  .navitem{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:8px;color:#c9c6dd;font-size:13px;cursor:pointer;margin-bottom:2px}
  .navitem:hover{background:#1c1a30;color:#fff}
  .navitem.on{background:#292347;color:#fff;font-weight:600}
  .navitem .ic{width:16px;text-align:center;font-size:12px;opacity:.9}
  .navitem .pill{margin-left:auto;background:var(--brand);color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;font-weight:700}
  .sidefoot{padding:11px;border-top:1px solid #221e39;font-size:11.5px;color:#8b86b0}
  .sidefoot a{color:#a9a5c9;display:block;padding:4px 2px}
  .sidefoot a:hover{color:#fff}
  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header.top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);
              border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header.top h1{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.2px}
  header.top .sub{font-size:12px;color:var(--muted)}
  header.top .grow{flex:1}
  .content{padding:18px 22px 50px;max-width:1560px;width:100%}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(17,16,24,.05)}
  .card .hd{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .card .hd h3{margin:0;font-size:13.5px;font-weight:700}
  .card .hd .grow{flex:1}
  .card .bd{padding:14px}
  .grid{display:grid;gap:12px}
  .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21{grid-template-columns:2fr 1fr}
  @media (max-width:1350px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:1050px){.g4,.g3,.g2,.g21{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:700px){.g6,.g4,.g3,.g2,.g21{grid-template-columns:1fr}aside{display:none}.content{padding:12px}header.top{padding:10px 12px}}
  .kpi{padding:12px 13px}
  .kpi .l{font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:center}
  .kpi .v{font-size:21px;font-weight:750;letter-spacing:-.5px;margin-top:5px;line-height:1.15}
  .kpi .f{font-size:10.5px;color:var(--muted);margin-top:3px}
  .kpi.brand{background:linear-gradient(135deg,#5b3df5,#7c5cff);border:0;color:#fff}
  .kpi.brand .l,.kpi.brand .f{color:#ded7ff}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:#fff;
       font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#c8c3df;background:#fbfaff}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-dark)}
  .btn.sm{padding:4px 8px;font-size:11.5px;border-radius:6px}
  .btn.danger{color:var(--bad);border-color:#f3cccc}
  .btn.dark{background:#15132a;border-color:#15132a;color:#fff}
  .row{display:flex;align-items:center;gap:8px}
  .row.wrap{flex-wrap:wrap}
  .grow{flex:1}
  .input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:0}
  .input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,61,245,.12)}
  label.f{display:block;font-size:11.5px;font-weight:650;color:#3d3b4d;margin-bottom:4px}
  .field{margin-bottom:11px}
  .hint{font-size:11px;color:var(--muted);margin-top:3px}
  table.t{width:100%;border-collapse:collapse}
  table.t th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:650;
             padding:8px 10px;border-bottom:1px solid var(--line);background:#fbfaff;white-space:nowrap}
  table.t td{padding:9px 10px;border-bottom:1px solid #f1eff8;vertical-align:middle}
  table.t tr:last-child td{border-bottom:0}
  table.t tbody tr.click{cursor:pointer}
  table.t tbody tr.click:hover td{background:#faf9ff}
  .scrollx{overflow-x:auto}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:10.5px;font-weight:650;background:#f0eff7;color:#4b4960;white-space:nowrap}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.warn{background:var(--warn-bg);color:var(--warn)}
  .badge.bad{background:var(--bad-bg);color:var(--bad)}
  .badge.info{background:var(--info-bg);color:var(--info)}
  .badge.brand{background:var(--brand-50);color:var(--brand-dark)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
  .mono{font-family:var(--mono);font-size:11.5px}
  .muted{color:var(--muted)}
  .tiny{font-size:11px}
  .right{text-align:right}
  .nowrap{white-space:nowrap}
  .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
  .empty{padding:26px 12px;text-align:center;color:var(--muted)}
  .empty .big{font-size:22px;margin-bottom:4px}
  .bar{height:6px;border-radius:5px;background:#eeecf7;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:5px;background:var(--brand)}
  .tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);padding:0 14px;overflow:auto}
  .tab{padding:9px 11px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand)}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:11.5px;font-weight:600;cursor:pointer;color:#4b4960}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .statline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #eeecf7;font-size:12.5px}
  .statline:last-child{border-bottom:0}
  .statline b{font-weight:650}
  .hr{height:1px;background:var(--line);margin:12px 0}
  .tile{border:1px solid var(--line);border-radius:9px;padding:9px 10px}
  .tile .v{font-size:17px;font-weight:700;letter-spacing:-.3px}
  .tile .l{font-size:10.5px;color:var(--muted)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px}
  #modals{position:fixed;inset:0;z-index:80;display:none}
  #modals.open{display:block}
  .scrim{position:absolute;inset:0;background:rgba(17,16,24,.45)}
  .modal{position:relative;margin:5vh auto;background:#fff;border-radius:14px;max-width:760px;width:calc(100% - 28px);max-height:88vh;
         display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.25)}
  .modal.wide{max-width:1080px}
  .modal header{padding:13px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .modal header h3{margin:0;font-size:14.5px}
  .modal .body{padding:16px;overflow:auto}
  .modal footer{padding:11px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#fbfaff;border-radius:0 0 14px 14px}
  .x{margin-left:auto;border:0;background:#f2f0fa;width:26px;height:26px;border-radius:7px;font-size:14px;cursor:pointer}
  #toasts{position:fixed;right:14px;bottom:14px;z-index:99;display:flex;flex-direction:column;gap:6px;max-width:360px}
  .toast{background:#1d1b2e;color:#fff;padding:9px 12px;border-radius:8px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:sl .16s ease-out}
  .toast.ok{background:#0d7a56}.toast.bad{background:#b23b3b}
  @keyframes sl{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
  .login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 20% 0%,#241d54,#0b0a14 70%)}
  .logincard{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:26px;box-shadow:0 30px 90px rgba(0,0,0,.35)}
  .copybox{background:#0f1020;color:#cfd3ff;padding:9px 11px;border-radius:8px;font-family:var(--mono);font-size:11px;word-break:break-all}
  .timeline{position:relative;padding-left:15px}
  .timeline:before{content:"";position:absolute;left:4px;top:3px;bottom:3px;width:2px;background:#eceaf6}
  .tl{position:relative;padding-bottom:11px}
  .tl:before{content:"";position:absolute;left:-14px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 2px #e6e1ff}
  .tl .tt{font-weight:600;font-size:12px}
  .tl .ss{font-size:11px;color:var(--muted)}
  details.adv{border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
  details.adv summary{padding:10px 12px;cursor:pointer;font-weight:650;font-size:12.5px}
  details.adv[open] summary{border-bottom:1px solid var(--line)}
  details.adv .inner{padding:12px}
  .mini-chip{font-size:10px;padding:2px 6px;border-radius:5px;background:#f0eff7;color:#4b4960;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div id="modals"><div class="scrim" onclick="closeModal()"></div><div id="modalslot"></div></div>
<div id="toasts"></div>
<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const num = n => Number(n || 0).toLocaleString("en-US");
const money = (n, cur) => {
  const c = cur || "UGX", v = Number(n || 0);
  return c + " " + (Math.abs(v) >= 1000 ? v.toLocaleString("en-US", {maximumFractionDigits: 0}) : v.toLocaleString("en-US", {maximumFractionDigits: 2}));
};
const pct = n => (n == null ? "—" : Number(n).toFixed(1) + "%");
const dt = s => {
  if (!s) return "—";
  const d = new Date(String(s).replace(" ", "T"));
  if (isNaN(d)) return String(s).slice(0, 16);
  const days = Math.floor((new Date() - d) / 86400000);
  if (days === 0 && String(s).length > 10) return d.toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"});
  if (days === 0) return "today";
  if (days === 1) return "yesterday";
  if (days > 0 && days < 7) return days + "d ago";
  return d.toLocaleDateString("en-GB", {day: "2-digit", month: "short", year: "numeric"});
};
const initials = n => (n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();
const AV = ["#5b3df5","#0d9f6e","#e0782f","#2563eb","#c2418b","#b7791f","#0e7490","#7c3aed"];
const av = s => AV[Math.abs(String(s || "").split("").reduce((a, c) => a + c.charCodeAt(0), 0)) % AV.length];
const avatar = (n, size) => `<span style="display:inline-grid;place-items:center;border-radius:50%;background:${av(n)};color:#fff;font-weight:700;width:${size||26}px;height:${size||26}px;font-size:${((size||26)*.4).toFixed(0)}px;flex:0 0 ${size||26}px">${esc(initials(n))}</span>`;
const STATUS = {active: "ok", trial: "info", paused: "warn", churned: "bad", cancelled: "bad"};
const RISK = {new: "", healthy: "ok", due: "info", overdue: "warn", at_risk: "bad", lost: "bad"};

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "bad" ? 5200 : 3000);
}
async function api(path, opts) {
  opts = opts || {};
  const init = {method: opts.method || "GET", headers: {"accept": "application/json"}, credentials: "same-origin"};
  if (opts.body !== undefined) { init.headers["content-type"] = "application/json"; init.body = JSON.stringify(opts.body); }
  const r = await fetch(path, init);
  const text = await r.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch (e) { data = {error: text.slice(0, 300)}; }
  if (!r.ok) { const e = new Error(data.message || data.error || ("HTTP " + r.status)); e.status = r.status; throw e; }
  return data;
}
function openModal(title, body, footer, wide) {
  $("#modalslot").innerHTML = `<div class="modal ${wide ? "wide" : ""}"><header><h3>${esc(title)}</h3><button class="x" onclick="closeModal()">✕</button></header>
    <div class="body">${body}</div>${footer ? `<footer>${footer}</footer>` : ""}</div>`;
  $("#modals").classList.add("open");
}
function closeModal() { $("#modals").classList.remove("open"); $("#modalslot").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

const S = {user: null, route: "", days: 30, tab: "overview", shops: {page: 1, search: "", status: "", plan: "", sort: "gmv"}};

const NAV = [
  {r: "/overview", label: "Overview", ic: "◎"},
  {r: "/shops", label: "Shops", ic: "▦"},
  {r: "/messaging", label: "Messaging", ic: "✉"},
  {r: "/retention", label: "Retention", ic: "◔"},
  {r: "/revenue", label: "Revenue", ic: "₵"},
  {r: "/queue", label: "Queue & worker", ic: "⏱"},
  {r: "/credentials", label: "Providers", ic: "⚡"},
  {r: "/capacity", label: "Capacity", ic: "▤"},
  {r: "/audit", label: "Audit log", ic: "≡"},
];

function shell(inner) {
  const which = "/" + (S.route.split("/")[1] || "overview");
  return `<div id="shell">
    <aside>
      <div class="logo"><span class="mark">↻</span> Rebuy <span class="tag">admin</span></div>
      <nav>${NAV.map(n => `<a class="navitem ${n.r === which ? "on" : ""}" href="#${n.r}"><span class="ic">${n.ic}</span>${esc(n.label)}</a>`).join("")}</nav>
      <div class="sidefoot">
        <div style="margin-bottom:6px">${esc(S.user ? S.user.email : "")}</div>
        <a href="/">↗ Open shop app</a>
        <a href="javascript:void 0" onclick="logout()">⏻ Sign out</a>
      </div>
    </aside>
    <main>
      <header class="top">
        <div><h1 id="pt"></h1><div class="sub" id="ps"></div></div>
        <div class="grow"></div>
        <div class="row" style="gap:6px">
          <button class="btn sm" onclick="tickNow(this)">⚡ Run worker now</button>
          <button class="btn sm" onclick="reseed(this)">↻ Reseed demo data</button>
        </div>
      </header>
      <div class="content" id="view">${inner}</div>
    </main>
  </div>`;
}
const PAGES = {
  "/overview": ["Platform overview", "Every shop, every message, every shilling recovered."],
  "/shops": ["Shops", "The full tenant list — filter, inspect and support."],
  "/messaging": ["Messaging", "Volume, delivery, failures and cost by provider."],
  "/retention": ["Retention engine", "Do reminders actually bring customers back?"],
  "/revenue": ["Revenue", "MRR, plan mix and trial conversion."],
  "/queue": ["Queue & worker", "What is due, what is stuck, and when the worker last ran."],
  "/credentials": ["Provider credentials", "Platform-wide WhatsApp, SMS and SMTP settings."],
  "/capacity": ["Capacity", "Evidence this platform carries 100+ shops."],
  "/audit": ["Audit log", "Every action, by whom, on which shop."],
};
const ROUTES = {};
const page = (p, fn) => { ROUTES[p] = fn; };
const sortBtns = (cur, opts, fn) => `<div class="chips">${opts.map(([v, l]) => `<span class="chip ${cur === v ? "on" : ""}" onclick="${fn}('${v}')">${esc(l)}</span>`).join("")}</div>`;

async function boot() {
  window.addEventListener("unhandledrejection", ev => {
    const e = ev.reason || {};
    if (e && e.status) { toast(e.message, "bad"); ev.preventDefault(); }
  });
  let me = null;
  try { me = await api("/api/auth/me"); } catch (e) {}
  const path = (location.hash || "#/overview").slice(1) || "/overview";
  if (!me || !me.authenticated || me.user.role !== "admin") {
    if (me && me.authenticated && me.user.role !== "admin") {
      $("#app").innerHTML = `<div class="login"><div class="logincard"><h2 style="margin:0 0 6px">Shop account</h2>
        <div class="muted tiny">You are signed in as a shop owner, not a platform admin.</div>
        <a class="btn primary mt12" style="width:100%;justify-content:center" href="/">Go to your shop dashboard</a>
        <button class="btn mt8" style="width:100%;justify-content:center" onclick="logout()">Sign out and use an admin account</button></div></div>`;
      return;
    }
    loginView();
    return;
  }
  S.user = me.user;
  render(path);
}
function loginView() {
  $("#app").innerHTML = `<div class="login"><div class="logincard">
    <div class="logo" style="padding:0 0 14px;color:#111018"><span class="mark">↻</span> Rebuy <span class="tag" style="color:#6a6879;border-color:#ddd">admin</span></div>
    <h2 style="margin:0 0 4px;font-size:19px;letter-spacing:-.3px">Platform sign in</h2>
    <div class="muted tiny mb12">For the Rebuy team only.</div>
    <form onsubmit="doLogin(event)">
      <div class="field"><label class="f">Email</label><input class="input" name="email" type="email" autocomplete="username" required placeholder="you@rebuy.ug"></div>
      <div class="field"><label class="f">Password</label><input class="input" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"></div>
      <button class="btn primary" style="width:100%;justify-content:center;padding:10px" type="submit">Sign in</button>
    </form>
    <div id="googleSlot" class="mt12"></div>
    <div class="tiny muted mt12">Access requires a platform admin account — ask an existing admin to add your email to <span class="mono">REBUY_ADMIN_EMAILS</span>.</div>
    <div class="tiny mt8"><a href="/">← Back to the shop app</a></div>
  </div></div>`;
}
async function doLogin(ev) {
  ev.preventDefault();
  const f = ev.target;
  try {
    await api("/api/auth/login", {method: "POST", body: {email: f.email.value.trim(), password: f.password.value}});
    location.reload();
  } catch (e) { toast(e.message, "bad"); }
}
async function logout() {
  try { await api("/api/auth/logout", {method: "POST"}); } catch (e) {}
  location.hash = ""; location.reload();
}
async function tickNow(btn) {
  btn.disabled = true;
  try {
    const r = await api("/api/admin/tick", {method: "POST", body: {}});
    const s = r.stats || {};
    toast(`Worker ran — ${s.dispatched || 0} sent, ${s.followups || 0} follow-ups, ${s.winbacks || 0} win-backs`, "ok");
    render(S.route);
  } catch (e) { toast(e.message, "bad"); }
  btn.disabled = false;
}
async function reseed(btn) {
  if (!confirm("Generate a fresh demo fleet? This REPLACES all shops, customers and sales in this database.")) return;
  btn.disabled = true; btn.textContent = "Generating…";
  try {
    const r = await api("/api/admin/seed", {method: "POST", body: {shops: 120, reset: true}});
    toast(`Fleet rebuilt: ${num(r.shops)} shops, ${num(r.customers)} customers, ${num(r.reminders)} reminders`, "ok");
    render(S.route);
  } catch (e) { toast(e.message, "bad"); }
  btn.disabled = false; btn.textContent = "↻ Reseed demo data";
}

async function render(path) {
  S.route = path;
  const key = "/" + (path.split("/")[1] || "overview");
  const fn = ROUTES[key] || ROUTES["/overview"];
  const meta = PAGES[key] || PAGES["/overview"];
  const app = $("#app");

function chart(series, msgSeries) {
  const w = 700, h = 170, pad = 24;
  if (!series.length) return `<div class="empty">No data</div>`;
  const max = Math.max(1, ...series.map(p => p.value));
  const mmax = Math.max(1, ...msgSeries.map(p => p.value));
  const n = series.length;
  const bw = Math.max(2, (w - pad * 2) / n - 2);
  const x = i => pad + i * ((w - pad * 2) / n);
  const y = v => h - 20 - (h - 30) * (v / max);
  const line = msgSeries.map((p, i) => `${i ? "L" : "M"}${(x(i) + bw / 2).toFixed(1)},${(h - 20 - (h - 30) * (p.value / mmax)).toFixed(1)}`).join(" ");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible">
    <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b3df5"/><stop offset="1" stop-color="#9a8cff"/></linearGradient></defs>
    ${series.map((p, i) => `<rect x="${x(i)}" y="${y(p.value)}" width="${bw}" height="${Math.max(0, h - 20 - y(p.value))}" rx="2" fill="url(#gg)"><title>${p.day}: ${money(p.value)}</title></rect>`).join("")}
    <path d="${line}" fill="none" stroke="#0d9f6e" stroke-width="1.8"/>
    <line x1="${pad}" x2="${w - pad}" y1="${h - 20}" y2="${h - 20}" stroke="#e5e3ee"/>
    <text x="${pad}" y="${h - 6}" font-size="9" fill="#6a6879">${series[0].day}</text>
    <text x="${w - pad}" y="${h - 6}" font-size="9" fill="#6a6879" text-anchor="end">${series[n - 1].day}</text>
  </svg>
  <div class="row mt8" style="gap:14px"><span class="tiny muted"><span class="dot" style="color:#5b3df5"></span> GMV</span>
  <span class="tiny muted"><span class="dot" style="color:#0d9f6e"></span> messages sent</span></div>`;
}

function credModal(channel, schema, driver, enabled) {
  const label = {whatsapp: "Meta WhatsApp Cloud API", sms: "Twilio SMS", email: "SMTP email"}[channel];
  openModal("Configure " + label, `
    <div class="field"><label class="f">Driver</label>
      <select class="input" id="cdDriver">
        <option value="sandbox" ${driver === "sandbox" ? "selected" : ""}>sandbox (simulated)</option>
        <option value="${channel === "whatsapp" ? "meta" : channel === "sms" ? "twilio" : "smtp"}" ${driver !== "sandbox" ? "selected" : ""}>${label}</option>
      </select></div>
    ${Object.entries(schema || {}).map(([k, hint]) => `<div class="field"><label class="f">${esc(k)}</label>
      <input class="input" id="cc_${esc(k)}" placeholder="${esc(hint)}" ${/token|password|secret/.test(k) ? 'type="password"' : ""}></div>`).join("")}
    <label class="row tiny" style="gap:6px;margin-top:6px"><input type="checkbox" id="cdEnabled" ${enabled ? "checked" : ""}> Enabled for all shops without their own credentials</label>
    <div class="hr"></div>
    <div class="row"><input class="input" id="cdTestTo" placeholder="test destination (+256… / email)"><button class="btn" onclick="testCred('${channel}')">Send test</button></div>
    <div class="tiny muted mt8" id="cdTestOut"></div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCred('${channel}')">Save credentials</button>`);
}
async function saveCred(channel) {
  const cfg = {};
  $$("[id^=cc_]").forEach(i => { if (i.value.trim()) cfg[i.id.slice(3)] = i.value.trim(); });
  try {
    await api("/api/admin/credentials", {method: "POST", body: {channel, driver: $("#cdDriver").value, config: cfg, enabled: $("#cdEnabled").checked}});
    closeModal(); toast("Credentials saved", "ok"); render("/credentials");
  } catch (e) { toast(e.message, "bad"); }
}
async function testCred(channel) {
  const cfg = {};
  $$("[id^=cc_]").forEach(i => { if (i.value.trim()) cfg[i.id.slice(3)] = i.value.trim(); });
  const out = $("#cdTestOut");
  out.textContent = "Sending…";
  try {
    const r = await api("/api/admin/credentials/test", {method: "POST", body: {channel, driver: $("#cdDriver").value, config: cfg, to: $("#cdTestTo").value}});
    out.innerHTML = r.ok ? `<span class="badge ok">sent</span> ${esc(r.detail || "")}` : `<span class="badge bad">failed</span> ${esc(r.detail || "")}`;
  } catch (e) { out.innerHTML = `<span class="badge bad">failed</span> ${esc(e.message)}`; }
}

      <div class="tiny muted">${esc(p.recommendation || "")}</div>
      <div class="hr"></div>
      <div class="tiny muted">Per-shop average rows: ${Object.entries(d.per_shop_avg || {}).map(([k, v]) => `<span class="mini-chip">${esc(k)} ${v}</span>`).join(" ")}</div>
    </div></div>
  </div>
  <div class="card mt16"><div class="hd"><h3>Row counts</h3></div>
    <div class="scrollx"><table class="t"><thead><tr><th>Table</th><th class="right">Rows</th></tr></thead><tbody>
    ${Object.entries(d.row_counts || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td class="right">${num(v)}</td></tr>`).join("")}
    </tbody></table></div></div>`);
});

/* --------------------------------------------------------------------- audit */
page("/audit", async () => {
  const d = await api("/api/admin/audit?limit=200");
  return shell(`
  <div class="card"><div class="hd"><h3>Recent activity</h3><div class="grow"></div>
    <input class="input" style="width:200px" id="auditFilter" placeholder="filter by action…" onkeydown="if(event.key==='Enter')loadAudit(this.value)"></div>
    <div class="scrollx"><table class="t"><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Shop</th><th>Detail</th></tr></thead><tbody>
    ${(d.rows || []).map(a => `<tr><td class="tiny nowrap">${dt(a.created_at)}</td><td class="tiny">${esc(a.actor || "")}</td>
      <td><span class="badge">${esc(a.action)}</span></td><td class="tiny">${esc(a.shop || (a.shop_id ? "#" + a.shop_id : "platform"))}</td>
      <td class="tiny muted" style="max-width:460px;white-space:normal">${esc((a.detail || "").slice(0, 200))}</td></tr>`).join("") || `<tr><td colspan="5"><div class="empty">Nothing logged yet</div></td></tr>`}
    </tbody></table></div></div>
  <div class="card mt16"><div class="hd"><h3>Action mix</h3></div><div class="bd">
    <div class="chips">${(d.actions || []).map(a => `<span class="chip">${esc(a.action)} · ${num(a.n)}</span>`).join("")}</div>
  </div></div>`);
});
async function loadAudit(q) {
  const d = await api("/api/admin/audit?limit=200&action=" + encodeURIComponent(q));
  toast(`Filtered: ${num((d.rows || []).length)} entries`, "ok");
  render("/audit");
}

/* ---------------------------------------------------------------------- boot */
window.addEventListener("DOMContentLoaded", boot);
if (document.readyState !== "loading") boot();
</script>
</body>
</html>
